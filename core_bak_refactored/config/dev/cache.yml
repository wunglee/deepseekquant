# 缓存配置 - 开发环境
# 三层缓存架构：Memory/Redis → DB → API
# 缓存模式选择（互斥，二选一）
# 选项：'memory' - 内存缓存（快速，但仅限当前进程）
#       'redis' - Redis缓存（跨进程共享，适合多实例部署）
cache_mode: memory  # 开发环境使用内存缓存，生产环境建议使用 redis

# 窗口化缓存策略
window_strategy:
  # 缓存窗口大小（period的整数倍，默认1）
  # 例如：period=daily, window_size=7 → 7天一个窗口
  #       period=weekly, window_size=4 → 4周一个窗口
  window_size:
    daily: 7
    weekly: 4
    monthly: 12
  # 启用窗口化缓存（按月/周粒度缓存）
  enabled: true
  
  # 默认窗口周期：monthly, weekly
  # 注意：不再支持 daily，最小粒度为周，避免过度碎片化
  default_period: weekly
  
  # 精细化缓存利用：只查询缺失窗口
  incremental_fetch: true

# 内存缓存配置（仅当 cache_mode=memory 时生效）
memory:
  max_windows: 1000  # 最多缓存1000个时间窗口（月/周）
  ttl: 300  # 过期时间（5分钟，秒）
  eviction_policy: lru  # 淘汰策略：LRU（最近最少使用）

# Redis缓存配置（仅当 cache_mode=redis 时生效）
redis:
  host: localhost
  port: 6379
  db: 0  # 数据库编号
  password: null  # 密码（如果有）
  ttl: 3600  # 过期时间（1小时，秒）
  compression: true  # 启用压缩（使用zlib压缩，节省存储空间）
  max_connections: 50  # 最大连接数
  socket_timeout: 5  # socket超时（秒）
  socket_connect_timeout: 5  # 连接超时（秒）

# 数据库缓存配置（第二层）
database:
  enabled: true  # 数据库层缓存

# 数据保留策略
retention:
  # 保留天数（0表示永久保留）
  keep_days: 0
  
  # 自动清理旧数据
  auto_cleanup: false
  
  # 清理计划（cron表达式）
  cleanup_schedule: "0 2 * * 0"  # 每周日凌晨2点

# 增量更新策略
incremental_update:
  # 启用增量更新（只获取最新数据）
  enabled: true
  
  # 更新频率（秒）
  update_interval: 86400  # 24小时
  
  # 最大回溯天数（当没有本地数据时）
  max_backfill_days: 365
  
  # 预热天数（用于技术指标计算）
  warmup_days: 30

# 数据验证
validation:
  # 启用数据完整性检查
  enabled: true
  
  # 检测数据缺失
  check_missing_dates: true
  
  # 检测异常值
  check_outliers: true
  
  # 异常值阈值（标准差倍数）
  outlier_threshold: 5.0

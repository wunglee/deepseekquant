# 市场数据源映射：{market_code: provider_id}
market_sources:
  CN: akshare
  US: yahoo
  HK: akshare
  JP: yahoo
  SG: yahoo
  EU: yahoo

# 市场基础信息（包含UI展示配置）
market_registry:
  CN:
    name: 中国A股
    display_name: 中国 A股  # UI展示名称
    icon: 🇨🇳
    currency: CNY
    timezone: Asia/Shanghai
    trading_hours: 09:30-11:30,13:00-15:00
    settlement_days: 1
    regulatory_body: CSRC
    market_cap_category: emerging
    default_trading_days: 245
  US:
    name: 美国股市
    display_name: 美国  # UI展示名称
    icon: 🇺🇸
    currency: USD
    timezone: America/New_York
    trading_hours: 09:30-16:00
    after_hours: 16:00-20:00
    pre_market: 04:00-09:30
    settlement_days: 2
    regulatory_body: SEC
    market_cap_category: developed
    default_trading_days: 252
  HK:

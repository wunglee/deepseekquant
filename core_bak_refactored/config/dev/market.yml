    currency: HKD
    timezone: Asia/Hong_Kong
    trading_hours: 09:30-12:00,13:00-16:00
    pre_market: 09:00-09:30
    settlement_days: 2
    regulatory_body: SFC
    market_cap_category: developed
    default_trading_days: 247
  JP:
    name: 日本股市
    display_name: 日本  # UI展示名称
    icon: 🇯🇵
    currency: JPY
    timezone: Asia/Tokyo
    trading_hours: 09:00-11:30,12:30-15:00
    settlement_days: 2
    regulatory_body: FSA
    market_cap_category: developed
    default_trading_days: 245
  EU:
    name: 欧洲股市
    display_name: 欧洲  # UI展示名称
    icon: 🇪🇺
    currency: EUR
    timezone: Europe/Paris
    trading_hours: 09:00-17:30
    settlement_days: 2
    regulatory_body: ESMA
    market_cap_category: developed
    default_trading_days: 255
  SG:
    name: 新加坡股市
    display_name: 新加坡  # UI展示名称
    icon: 🇸🇬
    currency: SGD
    timezone: Asia/Singapore
    trading_hours: 09:00-12:00,13:00-17:00
    settlement_days: 2
    regulatory_body: MAS
    market_cap_category: developed
    default_trading_days: 250
market_limit:
  CN:
    description: A股市场特定限额
    regulatory_framework: CSRC
    single_stock_max_weight: 0.1
    leverage_max: 1.0
    margin_account_leverage_max: 2.0
    daily_turnover_limit: 0.15
    limit_down_exposure_max: 0.1
    创业板_stock_max_weight: 0.08
    科创板_stock_max_weight: 0.08
    sector_max_weight: 0.3
    concentration_top10: 0.6
    st_stock_max_weight: 0.05
  US:
    description: 美股市场特定限额
    regulatory_framework: SEC/FINRA
    single_stock_max_weight: 0.15
    sector_max_weight: 0.4
    leverage_max: 4.0
    day_trading_min_equity: 25000
    pattern_day_trader_limit: 4.0
    concentration_top10: 0.7
    otc_stock_max_weight: 0.05
    penny_stock_max_weight: 0.03
  HK:
    description: 港股市场特定限额
    regulatory_framework: SFC
    single_stock_max_weight: 0.1
    sector_max_weight: 0.3
    leverage_max: 2.0
    concentration_top10: 0.6
    mainland_stock_max_weight: 0.1
    small_cap_max_weight: 0.05
  EU:
    description: 欧洲市场特定限额
    regulatory_framework: ESMA
    single_stock_max_weight: 0.12
    sector_max_weight: 0.35
    leverage_max: 3.0
    concentration_top10: 0.65
  JP:
    description: 日本市场特定限额
    regulatory_framework: JFSA
    single_stock_max_weight: 0.12
    sector_max_weight: 0.35
    leverage_max: 3.0
    concentration_top10: 0.65
  SG:
    description: 新加坡市场特定限额
    regulatory_framework: MAS
    single_stock_max_weight: 0.1
    sector_max_weight: 0.3
    leverage_max: 2.5
    concentration_top10: 0.6
trading_hours:
  CN:
    description: A股交易时段
    timezone: Asia/Shanghai
    open: 09:30
    close: '15:00'
    lunch_start: '11:30'
    lunch_end: '13:00'
    has_lunch_break: true
  HK:
    description: 港股交易时段
    timezone: Asia/Hong_Kong
    open: 09:30
    close: '16:00'
    lunch_start: '12:00'
    lunch_end: '13:00'
    has_lunch_break: true
  US:
    description: 美股交易时段
    timezone: America/New_York
    open: 09:30
    close: '16:00'
    has_lunch_break: false
  EU:
    description: 欧洲交易时段
    timezone: Europe/London
    open: 08:00
    close: '16:30'
    has_lunch_break: false
  JP:
    description: 日本交易时段
    timezone: Asia/Tokyo
    open: 09:00
    close: '15:00'
    lunch_start: '11:30'
    lunch_end: '12:30'
    has_lunch_break: true
  SG:
    description: 新加坡交易时段
    timezone: Asia/Singapore
    open: 09:00
    close: '17:00'
    lunch_start: '12:00'
    lunch_end: '13:00'
    has_lunch_break: true

# 市场特定机制配置
market_mechanisms:
  CN:
    has_limit_up_down: true
    limit_thresholds:
      main_board: 0.10  # 主板±10%
      gem: 0.20         # 创业板±20%
      st: 0.05          # ST股票±5%
      kcb: 0.20         # 科创板±20%
    price_limit: 0.10
    halt_risk_factor: 0.15
    consecutive_limit_days_p95: 3
  US:
    has_limit_up_down: false
    circuit_breaker_levels: [0.07, 0.13, 0.20]  # 美股熔断：7%、13%、20%
    luld_threshold: 0.05  # 涨跌幅限制（LULD）
    luld_window: 5        # LULD时间窗口（分钟）
    price_limit: null
    halt_risk_factor: 0.05
  HK:
    has_limit_up_down: false  # 港股无涨跌停
    price_limit: null
    halt_risk_factor: 0.10
  JP:
    has_limit_up_down: false
    price_limit: null
    halt_risk_factor: 0.06
  EU:
    has_limit_up_down: false
    price_limit: null
    halt_risk_factor: 0.07
  SG:
    has_limit_up_down: false
    price_limit: null
    halt_risk_factor: 0.08

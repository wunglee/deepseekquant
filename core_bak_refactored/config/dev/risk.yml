# 市场风险预警监控
market_monitoring:
  CN:
    volatility_spike_threshold: 0.05  # 波动率突增阈值
    limit_hit_ratio_threshold: 0.25  # 涨跌停命中率阈值
    major_event_sensitivity: 'MEDIUM'  # 重大事件敏感度
    volatility_tiers:
      NORMAL:
        max: 0.05
        cache_ttl: 3600
      MEDIUM:
        max: 0.075
        cache_ttl: 1800
      HIGH:
        max: 0.10
        cache_ttl: 600
      EXTREME:
        max: .inf
        cache_ttl: 60
    event_weights:
      circuit_breaker: 0.6
      extreme_correlation: 0.2
      limit_hits: 0.4
      major_event: 0.3

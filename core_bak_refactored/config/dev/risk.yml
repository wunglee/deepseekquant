# 风险配置

# 风险限额配置
limits:
  # 阈值层级（智能阈值分层系统）
  threshold_tiers:
    GREEN: 0.85    # 绿色区域：提前预警
    YELLOW: 1.0    # 黄色区域：标准限额
    ORANGE: 1.15   # 橙色区域：更敏感
    RED: 1.3       # 红色区域：监管要求

  # 优先级权重配置
  priority_weights:
    normal:
      severity: 0.30
      breach_amount: 0.25
      time_horizon: 0.20
      cascading_impact: 0.15
      regulatory_impact: 0.10
    high_volatility:
      severity: 0.25
      breach_amount: 0.20
      time_horizon: 0.30
      cascading_impact: 0.15
      regulatory_impact: 0.10
    regulatory_scrutiny:
      severity: 0.25
      breach_amount: 0.20
      time_horizon: 0.15
      cascading_impact: 0.15
      regulatory_impact: 0.25

# 风险管理参数（分市场）
risk_parameters:
  CN:
    risk_free_rate: 0.03  # 无风险利率
    risk_premium_base: 0.015  # 基础风险溢价
    var_method_priority: 'historical_simulation'  # VaR方法优先级
    covariance_lookback: 126  # 协方差回溯期（交易日）
    jump_adjustment_coef: 0.035  # 跳跃调整系数
    max_jump_adjustment: 0.18  # 最大跳跃调整
    evt_threshold: 0.85  # 极值理论阈值
    limit_adjustment_enabled: true  # 启用涨跌停调整
    min_required_returns: 30  # 最小样本量要求
    volatility_persistence: 0.94  # 波动率持续性
    liquidity_risk_weight: 1.2  # 流动性风险权重
    political_risk_premium: 0.008  # 政治风险溢价
  US:
    risk_free_rate: 0.045
    risk_premium_base: 0.010
    var_method_priority: 't_distribution'
    covariance_lookback: 756  # 3年
    jump_adjustment_coef: 0.02
    max_jump_adjustment: 0.12
    evt_threshold: 0.90
    limit_adjustment_enabled: false
    min_required_returns: 50
    volatility_persistence: 0.97
    liquidity_risk_weight: 0.85
    political_risk_premium: 0.003
  HK:

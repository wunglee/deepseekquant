# 数据库配置 - 开发环境
# 用于存储和缓存市场数据，提升性能和稳定性
# 2025-12-19 更新：支持四层缓存架构（Memory → Redis → DB → API）

# 数据库类型: sqlite, postgresql, mysql
database_type: sqlite

# SQLite 配置
sqlite:
  # 数据库文件路径（相对于项目根目录）
  database_path: data/market_data.db
  
  # 连接配置
  check_same_thread: false  # 允许多线程访问
  timeout: 30.0  # 超时时间（秒）
  
  # 性能优化
  journal_mode: WAL  # Write-Ahead Logging 模式，提升并发性能
  synchronous: NORMAL  # 同步模式: OFF, NORMAL, FULL
  cache_size: -64000  # 缓存大小（KB），负数表示KB，正数表示页数
  temp_store: MEMORY  # 临时表存储位置: DEFAULT, FILE, MEMORY
  
  # 连接池配置（用于未来扩展）
  pool_size: 5  # 连接池大小
  max_overflow: 10  # 最大溢出连接数
  pool_timeout: 30  # 连接池超时时间（秒）
  pool_recycle: 3600  # 连接回收时间（秒）

# 数据缓存策略（三层缓存架构）
cache_strategy:
  # 启用数据库缓存
  enabled: true
  
  # 缓存模式选择（互斥，二选一）
  # 选项：'memory' - 内存缓存（快速，但仅限当前进程）
  #       'redis' - Redis缓存（跨进程共享，适合多实例部署）
  cache_mode: memory  # 开发环境使用内存缓存，生产环境建议使用 redis
  
  # 内存缓存配置（仅当 cache_mode=memory 时生效）
  memory:
    max_windows: 1000  # 最多缓存1000个时间窗口（月/周）
    ttl: 300  # 过期时间（5分钟）
    eviction_policy: lru  # 淘汰策略：LRU（最近最少使用）
  
  # Redis缓存配置（仅当 cache_mode=redis 时生效）
  redis:
    host: localhost
    port: 6379
    db: 0  # 数据库编号
    password: null  # 密码（如果有）
    ttl: 3600  # 过期时间（1小时）
    compression: true  # 启用压缩（使用zlib压缩，节省存储空间）
    max_connections: 50  # 最大连接数
    socket_timeout: 5  # socket超时（秒）
    socket_connect_timeout: 5  # 连接超时（秒）
  
  # 数据库缓存配置（第二层）
  database:
    enabled: true  # 数据库层缓存
  
  # 数据保留策略
  retention:
    # 保留天数（0表示永久保留）
    keep_days: 0
    
    # 自动清理旧数据
    auto_cleanup: false
    
    # 清理计划（cron表达式）
    cleanup_schedule: "0 2 * * 0"  # 每周日凌晨2点
  
  # 窗口化缓存策略
  window_strategy:
    # 启用窗口化缓存（按月/周粒度缓存）
    enabled: true
    
    # 默认窗口周期：monthly, weekly
    # 注意：不再支持 daily，最小粒度为周，避免过度碎片化
    default_period: weekly
    
    # 精细化缓存利用：只查询缺失窗口
    incremental_fetch: true
    
    # 示例：查询12月1日-6月30日，缓存有1月、未有2月5-6月28日的周数据
    #        → 只查询12月、缺失的2月周数据
  
  # 增量更新策略
  incremental_update:
    # 启用增量更新（只获取最新数据）
    enabled: true
    
    # 更新频率
    update_interval: 86400  # 24小时（秒）
    
    # 最大回溯天数（当没有本地数据时）
    max_backfill_days: 365
    
    # 预热天数（用于技术指标计算）
    warmup_days: 30
  
  # 数据验证
  validation:
    # 启用数据完整性检查
    enabled: true
    
    # 检测数据缺失
    check_missing_dates: true
    
    # 检测异常值
    check_outliers: true
    
    # 异常值阈值（标准差倍数）
    outlier_threshold: 5.0

# 数据同步配置
sync:
  # 启用自动同步
  auto_sync: false
  
  # 同步频率（秒）
  sync_interval: 3600
  
  # 同步时间窗口（避免交易时段）
  sync_window:
    start_hour: 1  # 凌晨1点开始
    end_hour: 6  # 早上6点结束
  
  # 并发同步任务数
  max_concurrent_sync: 3
  
  # 失败重试
  retry:
    max_attempts: 3
    retry_delay: 60  # 重试延迟（秒）
    backoff_factor: 2  # 重试延迟倍增因子

# 性能监控
monitoring:
  # 启用性能监控
  enabled: true
  
  # 慢查询阈值（毫秒）
  slow_query_threshold: 1000
  
  # 记录查询统计
  log_queries: false
  
  # 数据库大小警告阈值（MB）
  size_warning_threshold: 1000

# PostgreSQL 配置（生产环境推荐）
postgresql:
  enabled: false
  host: localhost
  port: 5432
  database: deepseekquant
  user: postgres
  password: ""
  
  # 连接池配置
  pool_size: 10
  max_overflow: 20
  pool_timeout: 30
  pool_recycle: 3600
  
  # SSL配置
  ssl_mode: prefer  # disable, allow, prefer, require, verify-ca, verify-full

# MySQL 配置（备选）
mysql:
  enabled: false
  host: localhost
  port: 3306
  database: deepseekquant
  user: root
  password: ""
  charset: utf8mb4
  
  # 连接池配置
  pool_size: 10
  max_overflow: 20
  pool_timeout: 30
  pool_recycle: 3600

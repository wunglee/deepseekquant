# 风险限额配置

# 阈值层级（智能阈值分层系统）
threshold_tiers:
  GREEN: 0.85    # 绿色区域：提前预警
  YELLOW: 1.0    # 黄色区域：标准限额
  ORANGE: 1.15   # 橙色区域：更敏感
  RED: 1.3       # 红色区域：监管要求

# 优先级权重配置
priority_weights:
  normal:
    severity: 0.30
    breach_amount: 0.25
    time_horizon: 0.20
    cascading_impact: 0.15
    regulatory_impact: 0.10
  high_volatility:
    severity: 0.25
    breach_amount: 0.20
    time_horizon: 0.30
    cascading_impact: 0.15
    regulatory_impact: 0.10
  regulatory_scrutiny:
    severity: 0.25
    breach_amount: 0.20
    time_horizon: 0.15
    cascading_impact: 0.15
    regulatory_impact: 0.25

sovereign_debt_crisis:
  window_days: 90
  baseline_days: 504
  description: "主权债务危机：结构性长期事件"

geopolitical_risk:
  window_days: 30
  baseline_days: 252
  description: "地缘政治风险：突发冲击事件"

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>调度控制台 | DeepSeekQuant</title>
    <link rel="stylesheet" href="/static/css/common.css">
    <script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
    <style>
        #jobsChart { height: 340px; }
    </style>
</head>
<body>
<header class="app-header">
    <div class="header-container">
        <div class="header-brand"><a href="/dashboard" class="brand-logo">📊 DeepSeekQuant</a></div>
        <nav class="header-nav">
            <a href="/dashboard" class="nav-link">Dashboard</a>
            <a href="/explorer" class="nav-link">Explorer</a>
            <a href="/rules" class="nav-link">Rules</a>
            <a href="/scheduler" class="nav-link">Scheduler</a>
            <a href="/alerts-center" class="nav-link">Alerts</a>
            <a href="/providers" class="nav-link">Providers</a>
            <a href="/validation" class="nav-link">Validation</a>
            <a href="/realtime" class="nav-link">Realtime</a>
        </nav>
        <div class="header-actions"><div class="header-status"><span class="status-indicator"></span><span>系统运行中</span></div></div>
    </div>
</header>
<div class="container">
    <div class="toolbar">
        <button class="btn" onclick="refreshJobs()">刷新</button>
        <button class="btn" onclick="triggerNow()">立即执行</button>
        <button class="btn primary" onclick="toggleMaintenance()">维护模式开/关</button>
    </div>
    <div class="grid">
        <div class="card">
            <div class="card-header">作业列表</div>
            <div class="card-body">
                <table id="jobsTable">
                    <thead>
                        <tr><th>作业ID</th><th>名称</th><th>状态</th><th>计划</th><th>上次执行</th></tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        </div>
        <div class="card">
            <div class="card-header">近24小时执行概览</div>
            <div class="card-body"><div id="jobsChart"></div></div>
        </div>
    </div>
</div>
<script src="/static/js/common.js"></script>
<script>
    const jobsChart = echarts.init(document.getElementById('jobsChart'))
    function showEmpty(chart, text) { AppUtils.showEmptyChart(chart, text || '暂无数据'); }
    function refreshJobs() {
        fetch('/api/v1/status').then(r => r.json()).then(res => {
            const jobs = (res.system_status && res.system_status.scheduler && res.system_status.scheduler.jobs) || []
            const tbody = document.querySelector('#jobsTable tbody')
            tbody.innerHTML = jobs.map(j => `<tr><td>${j.id}</td><td>${j.name || ''}</td><td>${j.status || ''}</td><td>${j.schedule || ''}</td><td>${j.last_run || ''}</td></tr>`).join('')
            const grouped = jobs.reduce((acc, j) => { acc[j.status] = (acc[j.status] || 0) + 1; return acc }, {})
            const labels = Object.keys(grouped)
            const values = labels.map(k => grouped[k])
            if (!labels.length) return showEmpty(jobsChart)
            jobsChart.setOption({ tooltip: {}, xAxis: { type: 'category', data: labels }, yAxis: { type: 'value' }, series: [{ type: 'bar', data: values, itemStyle: { color: '#ef4444' } }] }, true)
        }).catch(() => showEmpty(jobsChart, '加载失败'))
    }
    function triggerNow() { fetch('/api/v1/trigger-check', { method: 'POST' }).then(() => refreshJobs()) }
    function toggleMaintenance() {
        fetch('/api/v1/maintenance?action=enable&duration=1800', { method: 'POST' }).then(() => setTimeout(() => fetch('/api/v1/maintenance?action=disable', { method: 'POST' }), 3000))
    }
    refreshJobs()
</script>
</body>
</html>

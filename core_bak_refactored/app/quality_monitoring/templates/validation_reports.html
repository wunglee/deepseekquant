<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>交叉验证与质量报告 | DeepSeekQuant</title>
    <link rel="stylesheet" href="/static/css/common.css">
    <script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
    <style>
        #cvChart { height: 340px; }
    </style>
</head>
<body>
<header class="app-header">
    <div class="header-container">
        <div class="header-brand"><a href="/dashboard" class="brand-logo">📊 DeepSeekQuant</a></div>
        <nav class="header-nav">
            <a href="/dashboard" class="nav-link">Dashboard</a>
            <a href="/explorer" class="nav-link">Explorer</a>
            <a href="/rules" class="nav-link">Rules</a>
            <a href="/scheduler" class="nav-link">Scheduler</a>
            <a href="/alerts-center" class="nav-link">Alerts</a>
            <a href="/providers" class="nav-link">Providers</a>
            <a href="/validation" class="nav-link">Validation</a>
            <a href="/realtime" class="nav-link">Realtime</a>
        </nav>
        <div class="header-actions"><div class="header-status"><span class="status-indicator"></span><span>系统运行中</span></div></div>
    </div>
</header>
<div class="container">
    <div class="toolbar">
        <button class="btn" onclick="loadCVLog()">加载验证日志</button>
        <button class="btn" onclick="exportReport()">导出报告(JSON)</button>
    </div>
    <div class="grid">
        <div class="card">
            <div class="card-header">交叉验证日志</div>
            <div class="card-body">
                <table id="cvTable">
                    <thead><tr><th>时间</th><th>数据源</th><th>检查项</th><th>结果</th><th>详情</th></tr></thead>
                    <tbody></tbody>
                </table>
            </div>
        </div>
        <div class="card">
            <div class="card-header">质量得分趋势</div>
            <div class="card-body"><div id="cvChart"></div></div>
        </div>
    </div>
</div>
<script src="/static/js/common.js"></script>
<script>
    const cvChart = echarts.init(document.getElementById('cvChart'))
    function showEmpty(chart, text) { AppUtils.showEmptyChart(chart, text || '暂无数据'); }
    function loadCVLog() {
        fetch('/api/v1/data/cross-validation-log').then(r => r.json()).then(res => {
            const log = res.log || []
            const tbody = document.querySelector('#cvTable tbody')
            tbody.innerHTML = log.map(item => `<tr><td>${item.timestamp || ''}</td><td>${item.source || ''}</td><td>${item.check || ''}</td><td>${item.result || ''}</td><td>${item.detail || ''}</td></tr>`).join('')
            if (!log.length) return showEmpty(cvChart)
            const times = log.map(i => i.timestamp)
            const scores = log.map(i => i.score || 0)
            cvChart.setOption({ tooltip: { trigger: 'axis' }, xAxis: { type: 'category', data: times }, yAxis: { type: 'value', min: 0, max: 100 }, series: [{ type: 'line', data: scores, itemStyle: { color: '#3b82f6' } }] }, true)
        }).catch(() => showEmpty(cvChart, '加载失败'))
    }
    function exportReport() {
        fetch('/api/v1/quality/report?period=7d&format=json&include_details=true').then(r => r.json()).then(res => {
            const a = document.createElement('a')
            const blob = new Blob([JSON.stringify(res.report || {}, null, 2)], { type: 'application/json' })
            a.href = URL.createObjectURL(blob)
            a.download = 'quality_report.json'
            a.click()
            URL.revokeObjectURL(a.href)
        })
    }
    loadCVLog()
</script>
</body>
</html>

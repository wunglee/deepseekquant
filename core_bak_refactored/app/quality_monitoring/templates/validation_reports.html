<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>交叉验证与质量报告 | DeepSeekQuant</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif; margin: 0; background: #f7f8fa; }
        header { background: #1f2937; color: #fff; padding: 14px 20px; }
        .container { padding: 16px; }
        .grid { display: grid; grid-template-columns: 2fr 1fr; gap: 16px; }
        .card { background: #fff; border: 1px solid #e5e7eb; border-radius: 8px; }
        .card-header { padding: 10px 12px; border-bottom: 1px solid #e5e7eb; font-weight: 600; }
        .card-body { padding: 8px; }
        #cvChart { height: 340px; }
        table { width: 100%; border-collapse: collapse; font-size: 13px; }
        th, td { border: 1px solid #e5e7eb; padding: 6px 8px; }
        th { background: #f3f4f6; text-align: left; }
        .toolbar { display: flex; gap: 8px; margin-bottom: 12px; }
        .btn { padding: 8px 12px; border: 1px solid #d1d5db; border-radius: 6px; background: #fff; cursor: pointer; }
    </style>
</head>
<body>
<header>
    <h2>交叉验证与质量报告</h2>
</header>
<div class="container">
    <div class="toolbar">
        <button class="btn" onclick="loadCVLog()">加载验证日志</button>
        <button class="btn" onclick="exportReport()">导出报告(JSON)</button>
    </div>
    <div class="grid">
        <div class="card">
            <div class="card-header">交叉验证日志</div>
            <div class="card-body">
                <table id="cvTable">
                    <thead><tr><th>时间</th><th>数据源</th><th>检查项</th><th>结果</th><th>详情</th></tr></thead>
                    <tbody></tbody>
                </table>
            </div>
        </div>
        <div class="card">
            <div class="card-header">质量得分趋势</div>
            <div class="card-body"><div id="cvChart"></div></div>
        </div>
    </div>
</div>
<script>
    const cvChart = echarts.init(document.getElementById('cvChart'))
    function showEmpty(chart, text) { chart.setOption({ series: [], graphic: [{ type: 'text', left: 'center', top: 'center', style: { text: text || '暂无数据', fontSize: 16, fill: '#999' } }] }, true) }
    function loadCVLog() {
        fetch('/api/v1/data/cross-validation-log').then(r => r.json()).then(res => {
            const log = res.log || []
            const tbody = document.querySelector('#cvTable tbody')
            tbody.innerHTML = log.map(item => `<tr><td>${item.timestamp || ''}</td><td>${item.source || ''}</td><td>${item.check || ''}</td><td>${item.result || ''}</td><td>${item.detail || ''}</td></tr>`).join('')
            if (!log.length) return showEmpty(cvChart)
            const times = log.map(i => i.timestamp)
            const scores = log.map(i => i.score || 0)
            cvChart.setOption({ tooltip: { trigger: 'axis' }, xAxis: { type: 'category', data: times }, yAxis: { type: 'value', min: 0, max: 100 }, series: [{ type: 'line', data: scores, itemStyle: { color: '#3b82f6' } }] }, true)
        }).catch(() => showEmpty(cvChart, '加载失败'))
    }
    function exportReport() {
        fetch('/api/v1/quality/report?period=7d&format=json&include_details=true').then(r => r.json()).then(res => {
            const a = document.createElement('a')
            const blob = new Blob([JSON.stringify(res.report || {}, null, 2)], { type: 'application/json' })
            a.href = URL.createObjectURL(blob)
            a.download = 'quality_report.json'
            a.click()
            URL.revokeObjectURL(a.href)
        })
    }
    loadCVLog()
</script>
</body>
</html>

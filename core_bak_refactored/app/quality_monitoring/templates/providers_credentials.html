<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>数据来源与凭证 | DeepSeekQuant</title>
    <link rel="stylesheet" href="/static/css/common.css">
    <style>
        .row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 8px; }
    </style>
</head>
<body>
<header class="app-header">
    <div class="header-container">
        <div class="header-brand"><a href="/dashboard" class="brand-logo">📊 DeepSeekQuant</a></div>
        <nav class="header-nav">
            <a href="/dashboard" class="nav-link">Dashboard</a>
            <a href="/explorer" class="nav-link">Explorer</a>
            <a href="/rules" class="nav-link">Rules</a>
            <a href="/scheduler" class="nav-link">Scheduler</a>
            <a href="/alerts-center" class="nav-link">Alerts</a>
            <a href="/providers" class="nav-link">Providers</a>
            <a href="/validation" class="nav-link">Validation</a>
            <a href="/realtime" class="nav-link">Realtime</a>
        </nav>
        <div class="header-actions"><div class="header-status"><span class="status-indicator"></span><span>系统运行中</span></div></div>
    </div>
</header>
<div class="container">
    <div class="grid">
        <div class="card">
            <div class="card-header">数据源列表</div>
            <div class="card-body">
                <table id="providersTable">
                    <thead><tr><th>名称</th><th>类型</th><th>状态</th><th>说明</th></tr></thead>
                    <tbody></tbody>
                </table>
            </div>
        </div>
        <div class="card">
            <div class="card-header">凭证配置</div>
            <div class="card-body">
                <div class="row"><input id="providerName" class="form-control" placeholder="提供者名称"><select id="providerType" class="form-control"><option>REST</option><option>CSV</option><option>SQL</option></select></div>
                <div class="row"><input id="apiKey" class="form-control" placeholder="API Key"><input id="secret" class="form-control" placeholder="Secret"></div>
                <div class="row"><input id="endpoint" class="form-control" placeholder="Endpoint URL"><input id="remarks" class="form-control" placeholder="备注"></div>
                <button class="btn btn-primary" onclick="saveCredential()">保存凭证</button>
            </div>
        </div>
    </div>
</div>
<script src="/static/js/common.js"></script>
<script>
    function refreshProviders() {
        // 读取系统配置中的数据源列表（占位，后续可改为专用端点）
        fetch('/api/v1/config').then(r => r.json()).then(res => {
            const providers = (res.config && res.config.data && res.config.data.providers) || []
            const tbody = document.querySelector('#providersTable tbody')
            tbody.innerHTML = providers.map(p => `<tr><td>${p.name || ''}</td><td>${p.type || ''}</td><td>${p.enabled ? '启用' : '停用'}</td><td>${p.description || ''}</td></tr>`).join('')
        })
    }
    function saveCredential() {
        const payload = {
            data: {
                providers: [{
                    name: document.getElementById('providerName').value,
                    type: document.getElementById('providerType').value,
                    credentials: { api_key: document.getElementById('apiKey').value, secret: document.getElementById('secret').value },
                    endpoint: document.getElementById('endpoint').value,
                    description: document.getElementById('remarks').value,
                    enabled: true
                }]
            }
        }
        fetch('/api/v1/config', { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) })
            .then(() => refreshProviders())
    }
    refreshProviders()
</script>
</body>
</html>

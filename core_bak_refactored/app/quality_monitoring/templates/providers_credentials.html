<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>市场数据源配置 | DeepSeekQuant</title>
    <link rel="stylesheet" href="/static/css/common.css">
    <style>
        .config-row {
            display: grid;
            grid-template-columns: 200px 1fr;
            gap: 20px;
            padding: 16px;
            border-bottom: 1px solid #e5e7eb;
        }
        .config-row:hover {
            background-color: #f9fafb;
        }
        .config-label {
            font-weight: 600;
            padding-top: 8px;
        }
        .radio-group {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            align-items: center;
        }
        .radio-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 12px;
            border-radius: 4px;
            white-space: nowrap;
        }
        .radio-item:hover {
            background-color: #f3f4f6;
        }
        .radio-item input[type="radio"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }
        
        .provider-row {
            display: grid;
            grid-template-columns: 200px 1fr 200px;
            gap: 20px;
            padding: 16px;
            border-bottom: 1px solid #e5e7eb;
            align-items: center;
        }
        .provider-row:hover {
            background-color: #f9fafb;
        }
        .provider-name {
            font-weight: 600;
        }
        .provider-actions {
            display: flex;
            gap: 8px;
            align-items: center;
        }
        .test-status {
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 500;
            white-space: nowrap;
        }
        .test-status.passed {
            background-color: #d1fae5;
            color: #065f46;
        }
        .test-status.failed {
            background-color: #fee2e2;
            color: #991b1b;
        }
        .config-params {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .param-input {
            display: flex;
            gap: 8px;
            align-items: center;
        }
        .param-input label {
            min-width: 100px;
            font-size: 13px;
        }
        .param-input input {
            flex: 1;
        }
        .free-config {
            color: #10b981;
            font-size: 14px;
        }
    </style>
</head>
<body>
<header class="app-header">
    <div class="header-container">
        <div class="header-brand"><a href="/dashboard" class="brand-logo">📊 DeepSeekQuant</a></div>
        <nav class="header-nav">
            <a href="/dashboard" class="nav-link">Dashboard</a>
            <a href="/explorer" class="nav-link">Explorer</a>
            <a href="/rules" class="nav-link">Rules</a>
            <a href="/scheduler" class="nav-link">Scheduler</a>
            <a href="/alerts-center" class="nav-link">Alerts</a>
            <a href="/providers" class="nav-link">Providers</a>
            <a href="/validation" class="nav-link">Validation</a>
            <a href="/realtime" class="nav-link">Realtime</a>
        </nav>
        <div class="header-actions"><div class="header-status"><span class="status-indicator"></span><span>系统运行中</span></div></div>
    </div>
</header>

<div class="container">
    <div class="card">
        <div class="card-header">市场数据源配置</div>
    </div>
    
    <!-- 上栏：市场配置 -->
    <div class="card" style="margin-top: 20px;">
        <div class="card-header">
            市场配置
            <button class="btn btn-primary" onclick="saveMarkets()" style="float:right;">💾 保存</button>
        </div>
        <div id="marketConfigs"></div>
    </div>
    
    <!-- 下栏：数据源配置 -->
    <div class="card" style="margin-top: 20px;">
        <div class="card-header">数据源配置</div>
        <div id="providerConfigs"></div>
    </div>
</div>

<script src="/static/js/common.js"></script>
<script>
// ========== 从后端获取数据 ==========
let markets = [];
let providers = [];
let marketConfig = {};
let providerCredentials = {};
// 简化状态管理：只在内存中维护passed/failed两种状态，用于UI显示
let providerTestStatus = {};  // 测试状态：{ provider_id: 'passed'|'failed' }

// 初始化：从后端加载配置
fetch('/api/v1/markets/config')
    .then(r => r.json())
    .then(res => {
        if (res.status === 'success') {
            markets = res.data.markets;
            providers = res.data.providers;
            marketConfig = res.data.market_sources;
            providerCredentials = res.data.credentials;
            
            // 从 providers 的 status 字段初始化测试状态（简化为passed/failed两种状态）
            providers.forEach(p => {
                const status = p.status || 'untested';
                // 映射 status 值：passed → passed, 其他状态 → failed
                if (status === 'passed') {
                    providerTestStatus[p.id] = 'passed';
                } else {
                    providerTestStatus[p.id] = 'failed';
                }
            });
            
            console.log('加载后端数据成功:', res.data);
            console.log('测试状态:', providerTestStatus);
            
            renderMarkets();
            renderProviders();
            AppUtils.setActiveNav();
        } else {
            AppUtils.showToast('加载配置失败: ' + res.message, 'danger');
        }
    })
    .catch(err => {
        console.error('加载配置失败:', err);
        AppUtils.showToast('加载配置失败: ' + err.message, 'danger');
    });

// 渲染市场配置
function renderMarkets() {
    const html = markets.map(m => {
        const supported = providers.filter(p => p.markets.includes(m.code));
        const radios = supported.map(p => {
            const testStatus = providerTestStatus[p.id] || 'failed';
            // 简化状态显示：只有启用和禁用两种状态
            const isEnabled = (testStatus === 'passed');
            const isChecked = marketConfig[m.code] === p.id;
            
            return `
            <div class="radio-item" style="${ !isEnabled ? 'opacity: 0.5;' : '' }">
                <input type="radio" 
                    name="market_${m.code}" 
                    value="${p.id}" 
                    ${isChecked ? 'checked' : ''}
                    ${!isEnabled ? 'disabled' : ''}
                    onchange="selectMarketSource('${m.code}', '${p.id}')">
                <label style="cursor: ${ isEnabled ? 'pointer' : 'not-allowed' };">
                    ${p.name}
                    ${ isEnabled ? '<span style="color:#10b981;">✓</span>' : '<span style="color:#ef4444;">✗</span>' }
                </label>
            </div>
        `;
        }).join('');
        
        return `
            <div class="config-row">
                <div class="config-label">${m.icon} ${m.name}</div>
                <div class="radio-group">${radios}</div>
            </div>
        `;
    }).join('');
    
    document.getElementById('marketConfigs').innerHTML = html;
}

// 渲染数据源配置
function renderProviders() {
    const html = providers.map(p => {
        let configHtml = '';
        let actionsHtml = '';
        
        const testStatus = providerTestStatus[p.id] || 'failed';
        // 简化状态显示：只有通过和未通过两种状态
        const displayStatus = (testStatus === 'passed') ? 'passed' : 'failed';
        const statusText = {
            'passed': '✅ 通过',
            'failed': '❌ 未通过'
        }[displayStatus];
        
        const statusClass = displayStatus;
        
        if (p.needsConfig) {
            const params = p.params.map(param => `
                <div class="param-input">
                    <label>${param.label}:</label>
                    <input type="${param.type}" 
                        class="form-control" 
                        id="${p.id}_${param.name}" 
                        placeholder="${param.placeholder}"
                        value="${providerCredentials[p.id]?.[param.name] || ''}">
                </div>
            `).join('');
            configHtml = `<div class="config-params">${params}</div>`;
            
            actionsHtml = `
                <div class="provider-actions">
                    <span class="test-status ${statusClass}">${statusText}</span>
                    <button class="btn btn-secondary" onclick="testProvider('${p.id}')" id="test_btn_${p.id}">🔌 测试并保存</button>
                </div>
            `;
        } else {
            configHtml = '<div class="free-config">✓ 免配置</div>';
            actionsHtml = `
                <div class="provider-actions">
                    <span class="test-status ${statusClass}">${statusText}</span>
                    <button class="btn btn-secondary" onclick="testProvider('${p.id}')" id="test_btn_${p.id}">🔌 测试</button>
                </div>
            `;
        }
        
        return `
            <div class="provider-row">
                <div class="provider-name">${p.name}</div>
                <div>${configHtml}</div>
                <div>${actionsHtml}</div>
            </div>
        `;
    }).join('');
    
    document.getElementById('providerConfigs').innerHTML = html;
}

// 选择市场数据源
function selectMarketSource(market, source) {
    marketConfig[market] = source;
    console.log(`市场 ${market} 选择数据源: ${source}`);
}

// 保存市场配置
function saveMarkets() {
    fetch('/api/v1/markets/config', {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ market_sources: marketConfig })
    })
    .then(r => r.json())
    .then(res => {
        if (res.status === 'success') {
            AppUtils.showToast('✅ ' + res.message, 'success');
        } else {
            AppUtils.showToast('❌ ' + res.message, 'danger');
        }
    })
    .catch(err => {
        AppUtils.showToast('❌ 保存失败: ' + err.message, 'danger');
    });
}

// 测试数据源连接
function testProvider(providerId) {
    const btn = document.getElementById(`test_btn_${providerId}`);
    const originalText = btn.innerHTML;
    btn.disabled = true;
    btn.innerHTML = '🔄 测试中...';
    
    // 获取用户输入的凭证（如果有）
    const provider = providers.find(p => p.id === providerId);
    const credentials = {};
    
    if (provider && provider.needsConfig) {
        // 读取用户输入的凭证
        for (const param of provider.params) {
            const value = document.getElementById(`${providerId}_${param.name}`)?.value;
            if (value) {
                credentials[param.name] = value;
            }
        }
        
        // 如果需要凭证但没有输入，提示用户
        if (Object.keys(credentials).length === 0) {
            btn.disabled = false;
            btn.innerHTML = originalText;
            AppUtils.showToast('⚠️ 请先填写凭证信息', 'warning');
            return;
        }
    }
    
    // 传递凭证进行测试
    fetch(`/api/v1/providers/${providerId}/test`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(credentials)
    })
    .then(r => r.json())
    .then(res => {
        // 更新测试状态（简化为passed/failed两种状态）
        if (res.test_result === 'passed') {
            providerTestStatus[providerId] = 'passed';
        } else {
            providerTestStatus[providerId] = 'failed';
        }
        
        // 重新渲染
        renderProviders();
        renderMarkets();
        
        if (res.status === 'success') {
            AppUtils.showToast('✅ ' + res.message + ' （凭证已保存）', 'success');
        } else {
            AppUtils.showToast('❌ ' + res.message, 'danger');
        }
    })
    .catch(err => {
        providerTestStatus[providerId] = 'failed';
        renderProviders();
        renderMarkets();
        AppUtils.showToast('❌ 测试失败: ' + err.message, 'danger');
    })
    .finally(() => {
        btn.disabled = false;
        btn.innerHTML = originalText;
    });
}
</script>
</body>
</html>

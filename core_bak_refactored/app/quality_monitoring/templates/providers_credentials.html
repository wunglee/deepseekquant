<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>数据来源与凭证 | DeepSeekQuant</title>
    <link rel="stylesheet" href="/static/css/common.css">
    <style>
        .row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 8px; }
    </style>
</head>
<body>
<header class="app-header">
    <div class="header-container">
        <div class="header-brand"><a href="/dashboard" class="brand-logo">📊 DeepSeekQuant</a></div>
        <nav class="header-nav">
            <a href="/dashboard" class="nav-link">Dashboard</a>
            <a href="/explorer" class="nav-link">Explorer</a>
            <a href="/rules" class="nav-link">Rules</a>
            <a href="/scheduler" class="nav-link">Scheduler</a>
            <a href="/alerts-center" class="nav-link">Alerts</a>
            <a href="/providers" class="nav-link">Providers</a>
            <a href="/validation" class="nav-link">Validation</a>
            <a href="/realtime" class="nav-link">Realtime</a>
        </nav>
        <div class="header-actions"><div class="header-status"><span class="status-indicator"></span><span>系统运行中</span></div></div>
    </div>
</header>
<div class="container">
    <!-- 数据源列表（单栏，移除凭证独立列表） -->
    <div class="card">
        <div class="card-header">
            内置数据源列表
            <span style="float:right; color: #6b7280; font-size: 14px;">共 <span id="providerCount">0</span> 个数据源</span>
        </div>
        <div class="card-body">
            <table id="providersTable">
                <thead><tr><th>名称</th><th>类型</th><th>市场覆盖</th><th>状态</th><th>操作</th></tr></thead>
                <tbody></tbody>
            </table>
        </div>
    </div>
</div>

<!-- 连接配置模态框 -->
<div id="configModal" style="display:none; position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(0,0,0,0.5); z-index:1000; align-items:center; justify-content:center;">
    <div class="card" style="width:600px; max-width:90%;">
        <div class="card-header">
            <span id="configFormTitle">连接配置</span>
            <button onclick="closeConfigModal()" style="float:right; background:none; border:none; cursor:pointer; font-size:20px;">&times;</button>
        </div>
        <div class="card-body">
            <div class="row">
                <label class="form-label">数据源:</label>
                <input id="configProviderName" class="form-control" disabled>
            </div>
            <div id="configFields"></div>
            <div style="display:flex; gap:8px; margin-top:12px;">
                <button class="btn btn-primary" onclick="saveConfig()">保存</button>
                <button class="btn" onclick="closeConfigModal()">取消</button>
            </div>
        </div>
    </div>
</div>
<script src="/static/js/common.js"></script>
<script>
    let providers = [];
    let currentProvider = null;
    
    // 数据源配置字段定义
    const CONFIG_FIELDS = {
        'akshare': [],  // 无需配置，完全免费
        'yahoo': [],    // 无需配置
        'tushare': [
            { name: 'token', label: 'Tushare Token', type: 'password', required: true, placeholder: '在 tushare.pro 注册获取' }
        ],
        'alpha_vantage': [
            { name: 'api_key', label: 'API Key', type: 'password', required: true, placeholder: '在 alphavantage.co 注册获取' }
        ]
    };
    
    // ========== 数据源管理 ==========
    function refreshProviders() {
        AppUtils.showLoading('#providersTable tbody');
        fetch('/api/v1/providers')
            .then(r => r.json())
            .then(res => {
                providers = res.providers || [];
                document.getElementById('providerCount').textContent = providers.length;
                const tbody = document.querySelector('#providersTable tbody');
                if (!providers.length) {
                    tbody.innerHTML = '<tr><td colspan="5" class="text-center text-muted">无可用数据源</td></tr>';
                    return;
                }
                tbody.innerHTML = providers.map((p) => {
                    const markets = (p.markets || []).join(', ');
                    const needsConfig = CONFIG_FIELDS[p.id] && CONFIG_FIELDS[p.id].length > 0;
                    const configBtn = needsConfig 
                        ? `<button class="btn btn-sm btn-warning" onclick="showConfigModal('${p.id}')" title="需要配置凭证">⚙️ 连接配置</button>`
                        : `<span class="badge badge-success" title="无需配置">✓ 免配置</span>`;
                    
                    const isActive = p.status === 'active';
                    // 活跃数据源：绿色徽章 | 非活跃数据源：灰色按钮
                    const statusBtn = isActive 
                        ? `<span class="badge badge-success" style="font-size:14px;">✓ 当前活跃</span>`
                        : `<button class="btn btn-sm btn-secondary" onclick="activateProvider('${p.id}')">切换到此源</button>`;
                    
                    return `<tr style="${isActive ? 'background-color: #f0f9ff;' : ''}">
                        <td><strong>${p.name || p.id}</strong><br/><small style="color:#6b7280;">${p.description || ''}</small></td>
                        <td><span class="badge badge-${getTypeBadge(p.type)}">${p.type || p.id}</span></td>
                        <td><small>${markets || '-'}</small></td>
                        <td>${statusBtn}</td>
                        <td style="white-space:nowrap;">
                            ${configBtn}
                            <button class="btn btn-sm btn-primary" onclick="testProvider('${p.id}')">测试</button>
                        </td>
                    </tr>`;
                }).join('');
            })
            .catch(err => {
                AppUtils.showToast('加载数据源失败: ' + err.message, 'danger');
                document.querySelector('#providersTable tbody').innerHTML = '<tr><td colspan="5" class="text-center text-danger">加载失败</td></tr>';
            });
    }
    
    function getTypeBadge(type) {
        const map = { 
            '免费开源': 'success',    // 绿色 - 推荐
            '商业API': 'primary',    // 蓝色
            '社区数据': 'info',       // 浅蓝色
            'alpha_vantage': 'warning' // 兼容旧配置
        };
        return map[type] || 'secondary';
    }
    
    // ========== 连接配置 ==========
    function showConfigModal(providerId) {
        currentProvider = providers.find(p => p.id === providerId);
        if (!currentProvider) return;
        
        document.getElementById('configFormTitle').textContent = `${currentProvider.name} - 连接配置`;
        document.getElementById('configProviderName').value = currentProvider.name;
        
        // 动态生成配置字段
        const fields = CONFIG_FIELDS[providerId] || [];
        const fieldsHtml = fields.map(field => `
            <div class="row">
                <label class="form-label">${field.label}${field.required ? ' *' : ''}:</label>
                <input id="config_${field.name}" class="form-control" 
                    type="${field.type}" 
                    placeholder="${field.placeholder}"
                    ${field.required ? 'required' : ''}>
            </div>
        `).join('');
        
        document.getElementById('configFields').innerHTML = fieldsHtml || '<p class="text-center text-muted">此数据源无需额外配置</p>';
        document.getElementById('configModal').style.display = 'flex';
    }
    
    function closeConfigModal() {
        document.getElementById('configModal').style.display = 'none';
        currentProvider = null;
    }
    
    function saveConfig() {
        if (!currentProvider) return;
        
        const fields = CONFIG_FIELDS[currentProvider.id] || [];
        const config = {};
        
        for (const field of fields) {
            const value = document.getElementById(`config_${field.name}`).value;
            if (field.required && !value) {
                AppUtils.showToast(`请填写 ${field.label}`, 'warning');
                return;
            }
            config[field.name] = value;
        }
        
        // 保存配置到凭证
        fetch('/api/v1/credentials', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                id: currentProvider.id,
                provider: currentProvider.id,
                type: 'api_key',
                ...config,
                enabled: true
            })
        })
        .then(r => r.json())
        .then(res => {
            if (res.status === 'success') {
                AppUtils.showToast('连接配置保存成功', 'success');
                closeConfigModal();
            } else {
                AppUtils.showToast(res.message || '保存失败', 'danger');
            }
        })
        .catch(err => AppUtils.showToast('保存失败: ' + err.message, 'danger'));
    }
    
    function testProvider(providerId) {
        AppUtils.showToast('正在测试连接...', 'info');
        fetch(`/api/v1/providers/${encodeURIComponent(providerId)}/test`, { method: 'POST' })
            .then(r => r.json())
            .then(res => {
                if (res.status === 'success' && res.test_result && res.test_result.connected) {
                    const msg = res.test_result.data_points 
                        ? `连接成功，延迟: ${res.test_result.latency_ms}ms，获取到 ${res.test_result.data_points} 条数据`
                        : `连接成功，延迟: ${res.test_result.latency_ms}ms`;
                    AppUtils.showToast(msg, 'success');
                } else {
                    const errorMsg = res.test_result && res.test_result.message 
                        ? res.test_result.message 
                        : '连接失败';
                    AppUtils.showToast(errorMsg, 'danger');
                }
            })
            .catch(err => AppUtils.showToast('测试失败: ' + err.message, 'danger'));
    }
    
    function activateProvider(providerId) {
        // 确认切换
        const provider = providers.find(p => p.id === providerId);
        if (!provider) return;
        
        if (!confirm(`确定要切换到 "${provider.name}" 吗？\n\n其他数据源将自动停用。`)) return;
        
        AppUtils.showToast('正在切换数据源...', 'info');
        fetch(`/api/v1/providers/${encodeURIComponent(providerId)}/activate`, { method: 'POST' })
            .then(r => r.json())
            .then(res => {
                if (res.status === 'success') {
                    AppUtils.showToast(res.message || '切换成功', 'success');
                    refreshProviders();
                } else {
                    AppUtils.showToast(res.message || '切换失败', 'danger');
                }
            })
            .catch(err => AppUtils.showToast('切换失败: ' + err.message, 'danger'));
    }
    
    // 初始化
    refreshProviders();
    AppUtils.setActiveNav();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>数据来源与凭证 | DeepSeekQuant</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif; margin: 0; background: #f7f8fa; }
        header { background: #111827; color: #fff; padding: 14px 20px; }
        .container { padding: 16px; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
        .card { background: #fff; border: 1px solid #e5e7eb; border-radius: 8px; }
        .card-header { padding: 10px 12px; border-bottom: 1px solid #e5e7eb; font-weight: 600; }
        .card-body { padding: 8px; }
        table { width: 100%; border-collapse: collapse; font-size: 13px; }
        th, td { border: 1px solid #e5e7eb; padding: 6px 8px; }
        th { background: #f3f4f6; text-align: left; }
        input, select, button { padding: 8px; border: 1px solid #d1d5db; border-radius: 6px; }
        .row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 8px; }
    </style>
</head>
<body>
<header>
    <h2>数据来源与凭证管理</h2>
</header>
<div class="container">
    <div class="grid">
        <div class="card">
            <div class="card-header">数据源列表</div>
            <div class="card-body">
                <table id="providersTable">
                    <thead><tr><th>名称</th><th>类型</th><th>状态</th><th>说明</th></tr></thead>
                    <tbody></tbody>
                </table>
            </div>
        </div>
        <div class="card">
            <div class="card-header">凭证配置</div>
            <div class="card-body">
                <div class="row"><input id="providerName" placeholder="提供者名称"><select id="providerType"><option>REST</option><option>CSV</option><option>SQL</option></select></div>
                <div class="row"><input id="apiKey" placeholder="API Key"><input id="secret" placeholder="Secret"></div>
                <div class="row"><input id="endpoint" placeholder="Endpoint URL"><input id="remarks" placeholder="备注"></div>
                <button onclick="saveCredential()">保存凭证</button>
            </div>
        </div>
    </div>
</div>
<script>
    function refreshProviders() {
        // 读取系统配置中的数据源列表（占位，后续可改为专用端点）
        fetch('/api/v1/config').then(r => r.json()).then(res => {
            const providers = (res.config && res.config.data && res.config.data.providers) || []
            const tbody = document.querySelector('#providersTable tbody')
            tbody.innerHTML = providers.map(p => `<tr><td>${p.name || ''}</td><td>${p.type || ''}</td><td>${p.enabled ? '启用' : '停用'}</td><td>${p.description || ''}</td></tr>`).join('')
        })
    }
    function saveCredential() {
        const payload = {
            data: {
                providers: [{
                    name: document.getElementById('providerName').value,
                    type: document.getElementById('providerType').value,
                    credentials: { api_key: document.getElementById('apiKey').value, secret: document.getElementById('secret').value },
                    endpoint: document.getElementById('endpoint').value,
                    description: document.getElementById('remarks').value,
                    enabled: true
                }]
            }
        }
        fetch('/api/v1/config', { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) })
            .then(() => refreshProviders())
    }
    refreshProviders()
</script>
</body>
</html>

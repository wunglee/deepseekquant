<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>数据来源与凭证 | DeepSeekQuant</title>
    <link rel="stylesheet" href="/static/css/common.css">
    <style>
        .row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 8px; }
    </style>
</head>
<body>
<header class="app-header">
    <div class="header-container">
        <div class="header-brand"><a href="/dashboard" class="brand-logo">📊 DeepSeekQuant</a></div>
        <nav class="header-nav">
            <a href="/dashboard" class="nav-link">Dashboard</a>
            <a href="/explorer" class="nav-link">Explorer</a>
            <a href="/rules" class="nav-link">Rules</a>
            <a href="/scheduler" class="nav-link">Scheduler</a>
            <a href="/alerts-center" class="nav-link">Alerts</a>
            <a href="/providers" class="nav-link">Providers</a>
            <a href="/validation" class="nav-link">Validation</a>
            <a href="/realtime" class="nav-link">Realtime</a>
        </nav>
        <div class="header-actions"><div class="header-status"><span class="status-indicator"></span><span>系统运行中</span></div></div>
    </div>
</header>
<div class="container">
    <div class="grid">
        <!-- 左侧：数据源列表 -->
        <div class="card">
            <div class="card-header">
                数据源列表
                <button class="btn btn-sm btn-primary" style="float:right;" onclick="showProviderForm()">+ 新增数据源</button>
            </div>
            <div class="card-body">
                <table id="providersTable">
                    <thead><tr><th>名称</th><th>类型</th><th>状态</th><th>操作</th></tr></thead>
                    <tbody></tbody>
                </table>
            </div>
        </div>
        <!-- 右侧：凭证列表 -->
        <div class="card">
            <div class="card-header">
                凭证列表
                <button class="btn btn-sm btn-primary" style="float:right;" onclick="showCredentialForm()">+ 新增凭证</button>
            </div>
            <div class="card-body">
                <table id="credentialsTable">
                    <thead><tr><th>ID</th><th>提供者</th><th>类型</th><th>状态</th><th>操作</th></tr></thead>
                    <tbody></tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<!-- 数据源表单模态框 -->
<div id="providerModal" style="display:none; position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(0,0,0,0.5); z-index:1000; display:flex; align-items:center; justify-content:center;">
    <div class="card" style="width:500px; max-width:90%;">
        <div class="card-header">
            <span id="providerFormTitle">新增数据源</span>
            <button onclick="closeProviderModal()" style="float:right; background:none; border:none; cursor:pointer; font-size:20px;">&times;</button>
        </div>
        <div class="card-body">
            <div class="row"><label class="form-label">名称:</label><input id="providerName" class="form-control" placeholder="数据源名称"></div>
            <div class="row"><label class="form-label">类型:</label><select id="providerType" class="form-control"><option>REST</option><option>CSV</option><option>SQL</option><option>mock</option></select></div>
            <div class="row"><label class="form-label">端点:</label><input id="endpoint" class="form-control" placeholder="API 端点 URL"></div>
            <div class="row"><label class="form-label">说明:</label><input id="description" class="form-control" placeholder="备注说明"></div>
            <div class="row"><label class="form-label"><input type="checkbox" id="providerEnabled" checked> 启用</label></div>
            <div style="display:flex; gap:8px; margin-top:12px;">
                <button class="btn btn-primary" id="saveProviderBtn" onclick="saveProvider()">保存</button>
                <button class="btn" onclick="closeProviderModal()">取消</button>
            </div>
        </div>
    </div>
</div>

<!-- 凭证表单模态框 -->
<div id="credentialModal" style="display:none; position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(0,0,0,0.5); z-index:1000; align-items:center; justify-content:center;">
    <div class="card" style="width:500px; max-width:90%;">
        <div class="card-header">
            <span id="credentialFormTitle">新增凭证</span>
            <button onclick="closeCredentialModal()" style="float:right; background:none; border:none; cursor:pointer; font-size:20px;">&times;</button>
        </div>
        <div class="card-body">
            <div class="row"><label class="form-label">凭证ID:</label><input id="credentialId" class="form-control" placeholder="唯一标识符"></div>
            <div class="row"><label class="form-label">类型:</label><select id="credentialType" class="form-control"><option>api_key</option><option>oauth</option><option>basic_auth</option><option>token</option></select></div>
            <div class="row"><label class="form-label">提供者:</label><input id="credentialProvider" class="form-control" placeholder="关联的数据源"></div>
            <div class="row"><label class="form-label">用户名:</label><input id="username" class="form-control" placeholder="用户名（可选）"></div>
            <div class="row"><label class="form-label">API Key:</label><input id="apiKey" class="form-control" type="password" placeholder="API密钥"></div>
            <div class="row"><label class="form-label">Secret:</label><input id="secret" class="form-control" type="password" placeholder="密钥（可选）"></div>
            <div class="row"><label class="form-label"><input type="checkbox" id="credentialEnabled" checked> 启用</label></div>
            <div style="display:flex; gap:8px; margin-top:12px;">
                <button class="btn btn-primary" id="saveCredentialBtn" onclick="saveCredential()">保存</button>
                <button class="btn" onclick="closeCredentialModal()">取消</button>
            </div>
        </div>
    </div>
</div>
<script src="/static/js/common.js"></script>
<script>
    let providers = [];
    let credentials = [];
    let editingProvider = null;
    let editingCredential = null;
    
    // ========== 数据源管理 ==========
    function refreshProviders() {
        AppUtils.showLoading('#providersTable tbody');
        fetch('/api/v1/providers')
            .then(r => r.json())
            .then(res => {
                providers = res.providers || [];
                const tbody = document.querySelector('#providersTable tbody');
                if (!providers.length) {
                    tbody.innerHTML = '<tr><td colspan="4" class="text-center text-muted">暂无数据源</td></tr>';
                    return;
                }
                tbody.innerHTML = providers.map((p) => `<tr>
                    <td>${p.name || ''}</td>
                    <td><span class="badge badge-${getTypeBadge(p.type)}">${p.type || ''}</span></td>
                    <td><span class="badge badge-${p.status === 'active' ? 'success' : 'secondary'}">${p.status === 'active' ? '启用' : '停用'}</span></td>
                    <td style="white-space:nowrap;">
                        <button class="btn btn-sm" onclick='editProvider(${JSON.stringify(p)})'>编辑</button>
                        <button class="btn btn-sm btn-${p.status === 'active' ? 'info' : 'success'}" onclick="toggleProvider('${p.id || p.name}')">${p.status === 'active' ? '停用' : '启用'}</button>
                        <button class="btn btn-sm btn-primary" onclick="testProvider('${p.id || p.name}')">测试</button>
                        <button class="btn btn-sm btn-danger" onclick="deleteProvider('${p.id || p.name}')">删除</button>
                    </td>
                </tr>`).join('');
            })
            .catch(err => {
                AppUtils.showToast('加载数据源失败: ' + err.message, 'danger');
                document.querySelector('#providersTable tbody').innerHTML = '<tr><td colspan="4" class="text-center text-danger">加载失败</td></tr>';
            });
    }
    
    function getTypeBadge(type) {
        const map = { 'REST': 'primary', 'CSV': 'success', 'SQL': 'warning' };
        return map[type] || 'secondary';
    }
    
    function showProviderForm() {
        editingProvider = null;
        document.getElementById('providerFormTitle').textContent = '新增数据源';
        document.getElementById('providerName').value = '';
        document.getElementById('providerName').disabled = false;
        document.getElementById('providerType').value = 'REST';
        document.getElementById('endpoint').value = '';
        document.getElementById('description').value = '';
        document.getElementById('providerEnabled').checked = true;
        document.getElementById('providerModal').style.display = 'flex';
    }
    
    function editProvider(provider) {
        editingProvider = provider;
        document.getElementById('providerFormTitle').textContent = '编辑数据源';
        document.getElementById('providerName').value = provider.name || '';
        document.getElementById('providerName').disabled = true;
        document.getElementById('providerType').value = provider.type || 'REST';
        document.getElementById('endpoint').value = provider.endpoint || '';
        document.getElementById('description').value = provider.description || '';
        document.getElementById('providerEnabled').checked = provider.enabled !== false;
        document.getElementById('providerModal').style.display = 'flex';
    }
    
    function closeProviderModal() {
        document.getElementById('providerModal').style.display = 'none';
        editingProvider = null;
    }
    
    function saveProvider() {
        const payload = {
            name: document.getElementById('providerName').value,
            type: document.getElementById('providerType').value,
            endpoint: document.getElementById('endpoint').value,
            description: document.getElementById('description').value,
            enabled: document.getElementById('providerEnabled').checked
        };
        
        if (!payload.name || !payload.type) {
            AppUtils.showToast('请填写名称和类型', 'warning');
            return;
        }
        
        const method = editingProvider ? 'PUT' : 'POST';
        const url = editingProvider 
            ? `/api/v1/providers/${encodeURIComponent(editingProvider.name)}`
            : '/api/v1/providers';
        
        fetch(url, {
            method: method,
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        })
        .then(r => r.json())
        .then(res => {
            if (res.status === 'success') {
                AppUtils.showToast(editingProvider ? '数据源更新成功' : '数据源创建成功', 'success');
                closeProviderModal();
                refreshProviders();
            } else {
                AppUtils.showToast(res.message || '操作失败', 'danger');
            }
        })
        .catch(err => AppUtils.showToast('操作失败: ' + err.message, 'danger'));
    }
    
    function deleteProvider(name) {
        if (!confirm(`确定要删除数据源 "${name}" 吗？`)) return;
        
        fetch(`/api/v1/providers/${encodeURIComponent(name)}`, { method: 'DELETE' })
            .then(r => r.json())
            .then(res => {
                if (res.status === 'success') {
                    AppUtils.showToast('数据源删除成功', 'success');
                    refreshProviders();
                } else {
                    AppUtils.showToast(res.message || '删除失败', 'danger');
                }
            })
            .catch(err => AppUtils.showToast('删除失败: ' + err.message, 'danger'));
    }
    
    function testProvider(providerId) {
        AppUtils.showToast('正在测试连接...', 'info');
        fetch(`/api/v1/providers/${encodeURIComponent(providerId)}/test`, { method: 'POST' })
            .then(r => r.json())
            .then(res => {
                if (res.status === 'success' && res.test_result && res.test_result.connected) {
                    const msg = res.test_result.data_points 
                        ? `连接成功，延迟: ${res.test_result.latency_ms}ms，获取到 ${res.test_result.data_points} 条数据`
                        : `连接成功，延迟: ${res.test_result.latency_ms}ms`;
                    AppUtils.showToast(msg, 'success');
                } else {
                    const errorMsg = res.test_result && res.test_result.message 
                        ? res.test_result.message 
                        : '连接失败';
                    AppUtils.showToast(errorMsg, 'danger');
                }
            })
            .catch(err => AppUtils.showToast('测试失败: ' + err.message, 'danger'));
    }
    
    function toggleProvider(providerId) {
        fetch(`/api/v1/providers/${encodeURIComponent(providerId)}/toggle`, { method: 'POST' })
            .then(r => r.json())
            .then(res => {
                if (res.status === 'success') {
                    AppUtils.showToast(res.message || '状态已更新', 'success');
                    refreshProviders();
                } else {
                    AppUtils.showToast(res.message || '状态切换失败', 'danger');
                }
            })
            .catch(err => AppUtils.showToast('状态切换失败: ' + err.message, 'danger'));
    }
    
    // ========== 凭证管理 ==========
    function refreshCredentials() {
        AppUtils.showLoading('#credentialsTable tbody');
        fetch('/api/v1/credentials')
            .then(r => r.json())
            .then(res => {
                credentials = res.credentials || [];
                const tbody = document.querySelector('#credentialsTable tbody');
                if (!credentials.length) {
                    tbody.innerHTML = '<tr><td colspan="5" class="text-center text-muted">暂无凭证</td></tr>';
                    return;
                }
                tbody.innerHTML = credentials.map((c) => `<tr>
                    <td>${c.id || ''}</td>
                    <td>${c.provider || '-'}</td>
                    <td><span class="badge badge-info">${c.type || ''}</span></td>
                    <td><span class="badge badge-${c.enabled ? 'success' : 'danger'}">${c.enabled ? '启用' : '停用'}</span></td>
                    <td style="white-space:nowrap;">
                        <button class="btn btn-sm" onclick='editCredential(${JSON.stringify(c)})'>编辑</button>
                        <button class="btn btn-sm btn-danger" onclick="deleteCredential('${c.id}')">删除</button>
                    </td>
                </tr>`).join('');
            })
            .catch(err => {
                AppUtils.showToast('加载凭证失败: ' + err.message, 'danger');
                document.querySelector('#credentialsTable tbody').innerHTML = '<tr><td colspan="5" class="text-center text-danger">加载失败</td></tr>';
            });
    }
    
    function showCredentialForm() {
        editingCredential = null;
        document.getElementById('credentialFormTitle').textContent = '新增凭证';
        document.getElementById('credentialId').value = '';
        document.getElementById('credentialId').disabled = false;
        document.getElementById('credentialType').value = 'api_key';
        document.getElementById('credentialProvider').value = '';
        document.getElementById('username').value = '';
        document.getElementById('apiKey').value = '';
        document.getElementById('secret').value = '';
        document.getElementById('credentialEnabled').checked = true;
        document.getElementById('credentialModal').style.display = 'flex';
    }
    
    function editCredential(credential) {
        editingCredential = credential;
        document.getElementById('credentialFormTitle').textContent = '编辑凭证';
        document.getElementById('credentialId').value = credential.id || '';
        document.getElementById('credentialId').disabled = true;
        document.getElementById('credentialType').value = credential.type || 'api_key';
        document.getElementById('credentialProvider').value = credential.provider || '';
        document.getElementById('username').value = credential.username || '';
        document.getElementById('apiKey').value = ''; // 不回显敏感信息
        document.getElementById('secret').value = '';
        document.getElementById('credentialEnabled').checked = credential.enabled !== false;
        document.getElementById('credentialModal').style.display = 'flex';
    }
    
    function closeCredentialModal() {
        document.getElementById('credentialModal').style.display = 'none';
        editingCredential = null;
    }
    
    function saveCredential() {
        const payload = {
            id: document.getElementById('credentialId').value,
            type: document.getElementById('credentialType').value,
            provider: document.getElementById('credentialProvider').value,
            username: document.getElementById('username').value,
            api_key: document.getElementById('apiKey').value,
            secret: document.getElementById('secret').value,
            enabled: document.getElementById('credentialEnabled').checked
        };
        
        if (!payload.id || !payload.type) {
            AppUtils.showToast('请填写凭证ID和类型', 'warning');
            return;
        }
        
        const method = editingCredential ? 'PUT' : 'POST';
        const url = editingCredential 
            ? `/api/v1/credentials/${encodeURIComponent(editingCredential.id)}`
            : '/api/v1/credentials';
        
        fetch(url, {
            method: method,
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        })
        .then(r => r.json())
        .then(res => {
            if (res.status === 'success') {
                AppUtils.showToast(editingCredential ? '凭证更新成功' : '凭证创建成功', 'success');
                closeCredentialModal();
                refreshCredentials();
            } else {
                AppUtils.showToast(res.message || '操作失败', 'danger');
            }
        })
        .catch(err => AppUtils.showToast('操作失败: ' + err.message, 'danger'));
    }
    
    function deleteCredential(id) {
        if (!confirm(`确定要删除凭证 "${id}" 吗？`)) return;
        
        fetch(`/api/v1/credentials/${encodeURIComponent(id)}`, { method: 'DELETE' })
            .then(r => r.json())
            .then(res => {
                if (res.status === 'success') {
                    AppUtils.showToast('凭证删除成功', 'success');
                    refreshCredentials();
                } else {
                    AppUtils.showToast(res.message || '删除失败', 'danger');
                }
            })
            .catch(err => AppUtils.showToast('删除失败: ' + err.message, 'danger'));
    }
    
    // 初始化
    refreshProviders();
    refreshCredentials();
    AppUtils.setActiveNav();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>质量规则管理 | DeepSeekQuant</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif; margin: 0; background: #f7f8fa; }
        header { background: #111827; color: #fff; padding: 14px 20px; }
        .container { padding: 16px; }
        .toolbar { display: flex; gap: 8px; margin-bottom: 12px; }
        .btn { padding: 8px 12px; border: 1px solid #d1d5db; border-radius: 6px; background: #fff; cursor: pointer; }
        .btn.primary { background: #2563eb; color: #fff; border-color: #2563eb; }
        .grid { display: grid; grid-template-columns: 2fr 1fr; gap: 16px; }
        .card { background: #fff; border: 1px solid #e5e7eb; border-radius: 8px; }
        .card-header { padding: 10px 12px; border-bottom: 1px solid #e5e7eb; font-weight: 600; }
        .card-body { padding: 8px; }
        #rulesChart { height: 340px; }
        table { width: 100%; border-collapse: collapse; font-size: 13px; }
        th, td { border: 1px solid #e5e7eb; padding: 6px 8px; }
        th { background: #f3f4f6; text-align: left; }
    </style>
</head>
<body>
<header>
    <h2>质量规则管理</h2>
</header>
<div class="container">
    <div class="toolbar">
        <button class="btn" onclick="refreshRules()">刷新</button>
        <button class="btn" onclick="toggleSelected(true)">启用选中</button>
        <button class="btn" onclick="toggleSelected(false)">停用选中</button>
        <button class="btn primary" onclick="saveChanges()">保存变更</button>
    </div>
    <div class="grid">
        <div class="card">
            <div class="card-header">规则列表</div>
            <div class="card-body">
                <table id="rulesTable">
                    <thead>
                        <tr><th>选择</th><th>规则ID</th><th>名称</th><th>状态</th><th>阈值</th><th>描述</th></tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        </div>
        <div class="card">
            <div class="card-header">规则命中概览</div>
            <div class="card-body"><div id="rulesChart"></div></div>
        </div>
    </div>
</div>
<script>
    const rulesChart = echarts.init(document.getElementById('rulesChart'))
    function showEmpty(chart, text) {
        chart.setOption({ series: [], graphic: [{ type: 'text', left: 'center', top: 'center', style: { text: text || '暂无数据', fontSize: 16, fill: '#999' } }] }, true)
    }
    function refreshRules() {
        fetch('/api/v1/config')
            .then(r => r.json()).then(res => {
                const rules = (res.config && res.config.monitoring && res.config.monitoring.rules) || []
                const tbody = document.querySelector('#rulesTable tbody')
                tbody.innerHTML = rules.map(r => `<tr>
                    <td><input type='checkbox' data-id='${r.id}' ${r.enabled ? 'checked' : ''}></td>
                    <td>${r.id}</td><td>${r.name || ''}</td><td>${r.enabled ? '启用' : '停用'}</td>
                    <td>${r.threshold ?? ''}</td><td>${r.description || ''}</td></tr>`).join('')
                const enabledCount = rules.filter(r => r.enabled).length
                rulesChart.setOption({
                    tooltip: {}, legend: { data: ['数量'] },
                    xAxis: { type: 'category', data: ['启用', '停用'] }, yAxis: { type: 'value' },
                    series: [{ type: 'bar', data: [enabledCount, rules.length - enabledCount], itemStyle: { color: '#6366f1' } }]
                }, true)
            }).catch(() => showEmpty(rulesChart, '加载失败'))
    }
    function toggleSelected(enable) {
        document.querySelectorAll('#rulesTable tbody input[type="checkbox"]').forEach(cb => {
            cb.checked = enable
        })
    }
    function saveChanges() {
        const rows = Array.from(document.querySelectorAll('#rulesTable tbody tr'))
        const rules = rows.map(row => {
            const id = row.children[1].textContent
            const enabled = row.querySelector('input[type="checkbox"]').checked
            const threshold = row.children[4].textContent
            return { id, enabled, threshold }
        })
        fetch('/api/v1/config', { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ monitoring: { rules } }) })
            .then(r => r.json()).then(() => refreshRules())
    }
    refreshRules()
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>警报中心 | DeepSeekQuant</title>
    <link rel="stylesheet" href="/static/css/common.css">
    <script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
    <style>
        #alertsChart { height: 340px; }
        .filters { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-bottom: 12px; }
    </style>
</head>
<body>
<header class="app-header">
    <div class="header-container">
        <div class="header-brand"><a href="/dashboard" class="brand-logo">📊 DeepSeekQuant</a></div>
        <nav class="header-nav">
            <a href="/dashboard" class="nav-link">Dashboard</a>
            <a href="/explorer" class="nav-link">Explorer</a>
            <a href="/rules" class="nav-link">Rules</a>
            <a href="/scheduler" class="nav-link">Scheduler</a>
            <a href="/alerts-center" class="nav-link">Alerts</a>
            <a href="/providers" class="nav-link">Providers</a>
            <a href="/validation" class="nav-link">Validation</a>
            <a href="/realtime" class="nav-link">Realtime</a>
        </nav>
        <div class="header-actions"><div class="header-status"><span class="status-indicator"></span><span>系统运行中</span></div></div>
    </div>
</header>
<div class="container">
    <div class="filters">
        <select id="level" class="form-control"><option value="">级别(全部)</option><option>INFO</option><option>WARN</option><option>ERROR</option></select>
        <select id="severity" class="form-control"><option value="">严重性(全部)</option><option>LOW</option><option>MEDIUM</option><option>HIGH</option></select>
        <input id="source" class="form-control" placeholder="数据源">
        <input id="hours" class="form-control" type="number" value="24" placeholder="最近小时数">
        <button class="btn btn-primary" onclick="loadAlerts()">查询</button>
    </div>
    <div class="grid">
        <div class="card">
            <div class="card-header">警报列表</div>
            <div class="card-body">
                <table id="alertsTable">
                    <thead>
                        <tr><th>时间</th><th>级别</th><th>严重性</th><th>来源</th><th>消息</th></tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        </div>
        <div class="card">
            <div class="card-header">警报分布</div>
            <div class="card-body"><div id="alertsChart"></div></div>
        </div>
    </div>
</div>
<script src="/static/js/common.js"></script>
<script>
    const alertsChart = echarts.init(document.getElementById('alertsChart'))
    function showEmpty(chart, text) { AppUtils.showEmptyChart(chart, text || '暂无数据'); }
    function loadAlerts() {
        const params = new URLSearchParams()
        const level = document.getElementById('level').value
        const severity = document.getElementById('severity').value
        const source = document.getElementById('source').value
        const hours = document.getElementById('hours').value
        if (level) params.append('level', level)
        if (severity) params.append('severity', severity)
        if (source) params.append('data_source', source)
        params.append('hours', hours || 24)
        params.append('page', 1)
        params.append('per_page', 200)
        fetch('/api/v1/alerts?' + params.toString())
            .then(r => r.json()).then(res => {
                const alerts = res.items || res.alerts || []
                const tbody = document.querySelector('#alertsTable tbody')
                tbody.innerHTML = alerts.map(a => `<tr><td>${a.timestamp || ''}</td><td>${a.level || ''}</td><td>${a.severity || ''}</td><td>${a.source || ''}</td><td>${a.message || ''}</td></tr>`).join('')
                if (!alerts.length) return showEmpty(alertsChart)
                const grouped = alerts.reduce((acc, a) => { acc[a.severity] = (acc[a.severity] || 0) + 1; return acc }, {})
                const labels = Object.keys(grouped)
                const values = labels.map(k => grouped[k])
                alertsChart.setOption({ tooltip: {}, legend: {}, series: [{ type: 'pie', radius: '65%', data: labels.map((l, i) => ({ name: l, value: values[i] })) }] }, true)
            }).catch(() => showEmpty(alertsChart, '加载失败'))
    }
    loadAlerts()
</script>
</body>
</html>

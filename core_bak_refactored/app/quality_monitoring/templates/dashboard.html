<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>数据质量仪表板 | DeepSeekQuant</title>
    <link rel="stylesheet" href="/static/css/common.css">
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/socket.io-client@4.7.2/dist/socket.io.min.js"></script>
    <style>
        .chart-container { height: 300px; width: 100%; }
        .metric-value { font-size: 32px; font-weight: 300; text-align: center; margin: 20px 0; }
        .metric-label { text-align: center; color: #666; font-size: 14px; }
        .alert-list { max-height: 300px; overflow-y: auto; }
        .alert-item { padding: 10px; border-left: 3px solid; margin-bottom: 10px; background: #fff9f9; border-radius: 4px; }
        .alert-critical { border-left-color: var(--danger-color); }
        .alert-high { border-left-color: var(--warning-color); }
        .alert-medium { border-left-color: var(--primary-color); }
        .alert-low { border-left-color: #9E9E9E; }
    </style>
</head>
<body>
<!-- 顶部导航栏 -->
<header class="app-header">
    <div class="header-container">
        <div class="header-brand">
            <a href="/dashboard" class="brand-logo">📊 DeepSeekQuant</a>
        </div>
        <nav class="header-nav">
            <a href="/dashboard" class="nav-link">Dashboard</a>
            <a href="/explorer" class="nav-link">Explorer</a>
            <a href="/rules" class="nav-link">Rules</a>
            <a href="/scheduler" class="nav-link">Scheduler</a>
            <a href="/alerts-center" class="nav-link">Alerts</a>
            <a href="/providers" class="nav-link">Providers</a>
            <a href="/validation" class="nav-link">Validation</a>
            <a href="/realtime" class="nav-link">Realtime</a>
        </nav>
        <div class="header-actions">
            <div class="header-status">
                <span class="status-indicator"></span>
                <span>系统运行中</span>
            </div>
        </div>
    </div>
</header>

<div class="container">
    <div class="grid">
        <!-- 总体质量卡片 -->
        <div class="card">
            <div class="card-header">
                总体质量评分
                <span class="badge badge-success">正常</span>
            </div>
            <div class="card-body">
                <div id="qualityGauge" class="chart-container"></div>
            </div>
        </div>

        <!-- 异常统计卡片 -->
        <div class="card">
            <div class="card-header">
                异常检测统计
                <button class="btn btn-sm btn-primary" onclick="refreshChart('anomalyChart')">刷新</button>
            </div>
            <div class="card-body">
                <div id="anomalyChart" class="chart-container"></div>
            </div>
        </div>

        <!-- 性能指标卡片 -->
        <div class="card">
            <div class="card-header">
                性能指标
                <button class="btn btn-sm btn-primary" onclick="refreshChart('performanceChart')">刷新</button>
            </div>
            <div class="card-body">
                <div id="performanceChart" class="chart-container"></div>
            </div>
        </div>

        <!-- 错误类型分布卡片 -->
        <div class="card">
            <div class="card-header">错误类型分布</div>
            <div class="card-body">
                <div id="errorDistributionChart" class="chart-container"></div>
            </div>
        </div>

        <!-- 系统状态卡片 -->
        <div class="card">
            <div class="card-header">系统状态</div>
            <div class="card-body">
                <div id="systemStatus">
                    <div class="metric-value" id="uptimeValue">--</div>
                    <div class="metric-label">系统运行时间</div>

                    <div class="metric-value" id="throughputValue">--</div>
                    <div class="metric-label">数据处理吞吐量 (points/sec)</div>

                    <div class="metric-value" id="successRateValue">--</div>
                    <div class="metric-label">成功率</div>
                </div>
            </div>
        </div>
    </div>

    <!-- 警报列表（单独行） -->
    <div class="card" style="margin-top: var(--spacing-lg);">
        <div class="card-header">
            实时警报
            <button class="btn btn-sm btn-primary" onclick="loadAlerts()">刷新</button>
        </div>
        <div class="card-body">
            <div id="alertsList" class="alert-list"></div>
        </div>
    </div>
</div>

<script src="/static/js/common.js"></script>
<script>
        // 初始化ECharts实例
        const qualityGauge = echarts.init(document.getElementById('qualityGauge'));
        const anomalyChart = echarts.init(document.getElementById('anomalyChart'));
        const performanceChart = echarts.init(document.getElementById('performanceChart'));
        const errorDistributionChart = echarts.init(document.getElementById('errorDistributionChart'));

        // WebSocket连接
        const socket = io();

        // 监听数据更新
        socket.on('quality_update', function(data) {
            updateDashboard(data);
        });

        // 监听警报更新
        socket.on('alert_update', function(alerts) {
            updateAlerts(alerts);
        });

        // 初始化仪表板
        function loadInitialData() {
            // 加载质量数据
            fetch('/api/dashboard/quality-data')
                .then(response => response.json())
                .then(data => {
                    console.log('收到质量数据:', data);
                    if (data.current_quality) {
                        updateDashboard(data);
                    } else {
                        // 即使没有数据也初始化图表为空状态
                        console.log('暂无质量数据，初始化空图表');
                        initEmptyCharts();
                    }
                })
                .catch(error => {
                    console.error('加载质量数据失败:', error);
                    initEmptyCharts();
                });

            // 加载告警数据
            fetch('/api/dashboard/alerts?hours=24')
                .then(response => response.json())
                .then(data => {
                    console.log('收到告警数据:', data);
                    if (data.alerts) {
                        updateAlerts(data.alerts);
                    } else {
                        updateAlerts([]);
                    }
                })
                .catch(error => {
                    console.error('加载告警数据失败:', error);
                    updateAlerts([]);
                });

            // 加载性能数据
            fetch('/api/dashboard/performance')
                .then(response => response.json())
                .then(data => {
                    console.log('收到性能数据:', data);
                    if (data.status === 'success' && data.performance) {
                        updateSystemStatus(data.performance);
                    } else {
                        updateSystemStatus({
                            uptime_human: '未启动',
                            throughput: 0,
                            success_rate: 0
                        });
                    }
                })
                .catch(error => {
                    console.error('加载性能数据失败:', error);
                    updateSystemStatus({
                        uptime_human: '接口不可用',
                        throughput: 0,
                        success_rate: 0
                    });
                });
        }
        
        // 初始化空图表
        function initEmptyCharts() {
            console.log('初始化空图表状态');
            updateQualityGauge(0);
            updateAnomalyChart([]);
            updatePerformanceChart([]);
            updateErrorDistributionChart({
                completeness: 0,
                consistency: 0,
                continuity: 0,
                reasonableness: 0
            });
        }
        
        // 页面加载完成后初始化
        loadInitialData();
        
        // 每5秒刷新一次数据
        setInterval(loadInitialData, 5000);

        // 更新仪表板函数
        function updateDashboard(data) {
            console.log('更新Dashboard:', data);
            
            // API返回的数据格式：{current_quality: {...}, history: [...]}
            const current = data.current_quality || data;
            const history = data.history || [];
            
            // 更新总体质量评分
            const overallScore = current.overall_score || 0;
            updateQualityGauge(overallScore);
            
            // 更新异常统计（从历史数据中提取）
            const anomalyHistory = history.map(item => ({
                timestamp: item.timestamp,
                count: item.anomaly_count || 0
            }));
            updateAnomalyChart(anomalyHistory);
            
            // 更新错误分布
            const errorDistribution = {
                completeness: 1 - (current.completeness || 1),
                consistency: 1 - (current.consistency || 1),
                continuity: 1 - (current.continuity || 1),
                reasonableness: 1 - (current.reasonableness || 1)
            };
            updateErrorDistributionChart(errorDistribution);
            
            // 更新性能指标（从历史数据）
            const performanceMetrics = history.map(item => ({
                timestamp: item.timestamp,
                score: item.overall_score || 0
            }));
            updatePerformanceChart(performanceMetrics);
        }

        function updateAlerts(alerts) {
            const alertList = document.getElementById('alertList');
            alertList.innerHTML = '';

            // 兼容不同数据结构
            if (!Array.isArray(alerts)) {
                alerts = alerts?.alerts || alerts?.items || [];
            }

            (alerts || []).slice(0, 10).forEach(alert => {
                const alertElement = document.createElement('div');
                alertElement.className = `alert-item alert-${alert.level || 'low'}`;
                alertElement.innerHTML = `
                    <strong>${new Date(alert.timestamp || Date.now()).toLocaleString()}</strong>
                    <br>${alert.message || ''}
                `;
                alertList.appendChild(alertElement);
            });

            if (!alerts || alerts.length === 0) {
                alertList.innerHTML = '<p>暂无警报</p>';
            }
        }

        function updateSystemStatus(stats) {
            document.getElementById('uptimeValue').textContent = stats.uptime_human || '未知';
            document.getElementById('throughputValue').textContent = Number(stats.throughput || 0).toFixed(2);
            document.getElementById('successRateValue').textContent = Number((stats.success_rate || 0) * 100).toFixed(1) + '%';
        }

        // 图表更新函数实现
        function updateQualityGauge(score) {
            const option = {
                series: [{
                    type: 'gauge',
                    startAngle: 180,
                    endAngle: 0,
                    min: 0,
                    max: 1,
                    splitNumber: 10,
                    axisLine: {
                        lineStyle: {
                            width: 6,
                            color: [
                                [0.3, '#FF5252'],
                                [0.7, '#FFB300'],
                                [1, '#4CAF50']
                            ]
                        }
                    },
                    pointer: {
                        itemStyle: {
                            color: 'auto'
                        }
                    },
                    axisTick: {
                        distance: -30,
                        length: 8,
                        lineStyle: {
                            color: '#fff',
                            width: 2
                        }
                    },
                    splitLine: {
                        distance: -30,
                        length: 30,
                        lineStyle: {
                            color: '#fff',
                            width: 4
                        }
                    },
                    axisLabel: {
                        color: 'auto',
                        distance: 40,
                        fontSize: 12,
                        formatter: function(value) {
                            return (value * 100).toFixed(0) + '%';
                        }
                    },
                    detail: {
                        valueAnimation: true,
                        formatter: function(value) {
                            return (value * 100).toFixed(2) + '%';
                        },
                        color: 'auto',
                        fontSize: 24
                    },
                    data: [{value: score}]
                }]
            };
            qualityGauge.setOption(option);
        }
        
        function updateAnomalyChart(anomalyHistory) {
            const times = anomalyHistory.map(item => new Date(item.timestamp).toLocaleTimeString());
            const counts = anomalyHistory.map(item => item.count);
            const hasData = anomalyHistory.length > 0;
            
            const option = {
                tooltip: hasData ? {
                    trigger: 'axis'
                } : {},
                xAxis: hasData ? {
                    type: 'category',
                    data: times
                } : {
                    type: 'category',
                    show: false
                },
                yAxis: hasData ? {
                    type: 'value',
                    name: '异常数量'
                } : {
                    type: 'value',
                    show: false
                },
                graphic: !hasData ? [{
                    type: 'text',
                    left: 'center',
                    top: 'center',
                    style: {
                        text: '暂无数据',
                        fontSize: 16,
                        fill: '#999'
                    }
                }] : [],
                series: hasData ? [{
                    data: counts,
                    type: 'line',
                    smooth: true,
                    itemStyle: {
                        color: '#FF5252'
                    },
                    areaStyle: {
                        color: 'rgba(255, 82, 82, 0.2)'
                    }
                }] : []
            };
            anomalyChart.setOption(option, true);
        }
        
        function updatePerformanceChart(performanceMetrics) {
            const times = performanceMetrics.map(item => new Date(item.timestamp).toLocaleTimeString());
            const scores = performanceMetrics.map(item => item.score * 100);
            const hasData = performanceMetrics.length > 0;
            
            const option = {
                tooltip: hasData ? {
                    trigger: 'axis',
                    formatter: function(params) {
                        return params[0].name + '<br/>' + '质量得分: ' + params[0].value.toFixed(2) + '%';
                    }
                } : {},
                xAxis: hasData ? {
                    type: 'category',
                    data: times
                } : {
                    type: 'category',
                    show: false
                },
                yAxis: hasData ? {
                    type: 'value',
                    name: '质量得分(%)',
                    min: 0,
                    max: 100
                } : {
                    type: 'value',
                    show: false
                },
                graphic: !hasData ? [{
                    type: 'text',
                    left: 'center',
                    top: 'center',
                    style: {
                        text: '暂无数据',
                        fontSize: 16,
                        fill: '#999'
                    }
                }] : [],
                series: hasData ? [{
                    data: scores,
                    type: 'bar',
                    itemStyle: {
                        color: '#2196F3'
                    }
                }] : []
            };
            performanceChart.setOption(option, true);
        }
        
        function updateErrorDistributionChart(errorDistribution) {
            const hasData = Object.values(errorDistribution).some(v => v > 0);
            
            const option = {
                tooltip: hasData ? {
                    trigger: 'item',
                    formatter: function(params) {
                        return params.name + ': ' + (params.value * 100).toFixed(2) + '%';
                    }
                } : {},
                legend: hasData ? {
                    bottom: '5%',
                    left: 'center'
                } : {
                    show: false
                },
                graphic: !hasData ? [{
                    type: 'text',
                    left: 'center',
                    top: 'center',
                    style: {
                        text: '暂无数据',
                        fontSize: 16,
                        fill: '#999'
                    }
                }] : [],
                series: hasData ? [{
                    name: '错误类型',
                    type: 'pie',
                    radius: ['40%', '70%'],
                    avoidLabelOverlap: false,
                    itemStyle: {
                        borderRadius: 10,
                        borderColor: '#fff',
                        borderWidth: 2
                    },
                    label: {
                        show: false,
                        position: 'center'
                    },
                    emphasis: {
                        label: {
                            show: true,
                            fontSize: '18',
                            fontWeight: 'bold'
                        }
                    },
                    labelLine: {
                        show: false
                    },
                    data: [
                        {value: errorDistribution.completeness || 0, name: '完整性'},
                        {value: errorDistribution.consistency || 0, name: '一致性'},
                        {value: errorDistribution.continuity || 0, name: '连续性'},
                        {value: errorDistribution.reasonableness || 0, name: '合理性'}
                    ]
                }] : []
            };
            errorDistributionChart.setOption(option, true);
        }
        
        // 刷新特定图表的函数
        function refreshChart(chartId) {
            console.log('刷新图表:', chartId);
            // 重新加载数据
            loadInitialData();
        }
    </script>
</body>
</html>

        /* Explorer 专用样式 */
        .two-columns {
            display: flex !important;
            gap: 16px;
            align-items: flex-start;
            flex-wrap: nowrap;
            min-height: 600px;
        }
        .left-panel {
            flex-shrink: 0;

            border: 1px solid #e5e7eb;
            border-radius: 8px;
            padding: 12px;
        }
        .right-panel {
            flex: 1;
            background: #fff;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            padding: 12px;
        }
        .panel-header {
            font-size: 14px;
            font-weight: 600;
            color: #374151;
            margin-bottom: 8px;
        }
        .segmented-control {
            display: flex;
            gap: 8px;
            align-items: center;
            flex-wrap: wrap;
        }
        
        /* ECharts 容器样式 */
        #klineChart,
        #indicatorChart {
            cursor: default;
        }
        
        .btn-segment {
            padding: 6px 14px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            background: #fff;
            color: #4b5563;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-segment:hover {
            background: #f3f4f6;
            border-color: #9ca3af;
        }
        .btn-segment.active {
            background: #2563eb;
            color: #fff;
            border-color: #2563eb;
        }
        .list {
            max-height: 500px;
            overflow-y: auto;
        }
        .list-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 12px;
            border-bottom: 1px solid #f3f4f6;
            cursor: pointer;
            transition: background 0.2s;
        }
        .list-item:hover {
            background: #f9fafb;
        }
        .list-item.active {
            background: #eff6ff;
            border-left: 3px solid #2563eb;
        }
        .list-item-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }
        .list-item-name {
            font-size: 14px;
            font-weight: 500;
            color: #1f2937;
        }
        .list-item-code {
            font-size: 12px;
            color: #6b7280;
        }
        .list-item-actions {
            display: flex;
            gap: 4px;
        }
        .btn-icon {
            padding: 4px 8px;
            border: none;
            background: transparent;
            color: #9ca3af;
            font-size: 12px;
            cursor: pointer;
            transition: color 0.2s;
        }
        .btn-icon:hover {
            color: #ef4444;
        }
        .indicator-area {
            margin-top: 12px;
        }
        #klineChart, #indicatorChart {
            width: 100%;
        }
        /* 模态框样式 */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
        }
        .modal-content {
            background: #fff;
            border-radius: 8px;
            padding: 20px;
            width: 90%;
            max-width: 400px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }
        .modal-header {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 16px;
            color: #1f2937;
        }
        .modal-footer {
            display: flex;
            gap: 8px;
            justify-content: flex-end;
            margin-top: 16px;
        }
    </style>
</head>

<div class="container">

                    <!-- (●) 模拟  (○) 真实 -->
                </div>
                <!-- 🔧 K线图：交易时段切换（仅Mock模式显示） -->
                <div id="klinePhaseSelector" class="segmented-control" style="display:none; width:300px;">
                    <!-- (●) 盘前  (○) 盘中  (○) 盘后 -->
                </div>
                <!-- 🔧 K线图：数据模式切换（仅K线图显示） -->
                <div id="klineModeSelector" class="segmented-control" style="display:none; width:200px;">

            <!-- 分时图容器（默认隐藏，由 intraday_chart.js 动态重建布局） -->

                <!-- 布局将由 IntradayChart.rebuildLayout() 动态生成 -->
            </div>

                <div id="indicatorSelector" class="segmented-control" style="margin-bottom:8px;">
                    <!-- (●) VOL  (○) MACD  (○) RSI  (○) KDJ  (○) OBV -->

            <!-- 底部：数据窗口控制条 -->

    <script src="/static/js/common.js"></script>
    <!-- 🔧 分时图独立模块 -->
    <script src="/static/js/intraday_chart.js"></script>
    <script>
// ==================== K线图相关（不受分时图影响） ====================
const klineChart = echarts.init(document.getElementById('klineChart'))
const indicatorChart = echarts.init(document.getElementById('indicatorChart'))
const dataZoomChart = echarts.init(document.getElementById('dataZoomContainer'))

// 🔧 使用 ECharts connect API 实现三个图表的自动同步（共享 dataZoom）
echarts.connect([klineChart, indicatorChart, dataZoomChart])

// ==================== 无限滚动触发逻辑 ====================
var isLoadingMore = false  // 加载状态标志
var hasMoreData = true      // 是否还有更多数据
var lastLoadPosition = -1   // 上次触发加载的位置（避免重复触发）
var lastStartValue = 100    // 记录上次的 start 值，用于检测用户是否在拖动
var userIsMoving = false    // 用户是否正在拖动
var movingResetTimer = null // 拖动重置定时器
var isAdjustingBySystem = false // 标记系统是否正在自动调整（避免误判为用户拖动）

// 暴露给 adjustDataZoomAfterPrepend 使用的标志
window.__dataZoomAdjusting = function(isAdjusting) {
    isAdjustingBySystem = isAdjusting
}

// 监听 K 线图、技术指标图、数据窗口控制条的 dataZoom 事件（触发无限滚动）
function startInfiniteScrollDetection() {
    window.setInterval(function() {
        try {
            // 🔧 优先从 K 线图获取 dataZoom 状态（主图表）
            let currentStart = 0
            let hasValidZoom = false
            
            // 尝试从 K 线图获取
            const kOption = klineChart.getOption()
            if (kOption && kOption.dataZoom && kOption.dataZoom[0]) {
                currentStart = kOption.dataZoom[0].start || 0
                hasValidZoom = true
            }
            
            // 如果 K 线图没有，尝试从技术指标图获取
            if (!hasValidZoom) {
                const iOption = indicatorChart.getOption()
                if (iOption && iOption.dataZoom && iOption.dataZoom[0]) {
                    currentStart = iOption.dataZoom[0].start || 0
                    hasValidZoom = true
                }
            }
            
            // 如果仍然没有，尝试从数据窗口控制条获取
            if (!hasValidZoom) {
                const dOption = dataZoomChart.getOption()
                if (dOption && dOption.dataZoom && dOption.dataZoom[0]) {
                    currentStart = dOption.dataZoom[0].start || 0
                    hasValidZoom = true
                }
            }
            
            if (!hasValidZoom) return
            
            // 🔧 检测用户是否在向左拖动（start 值减小）
            // ⚠️ 排除系统自动调整导致的变化
            if (Math.abs(currentStart - lastStartValue) > 0.5 && !isAdjustingBySystem) {
                userIsMoving = true
                
                // 如果用户向左拖动（start 减小），允许重新触发加载
                if (currentStart < lastStartValue) {
                    if (lastLoadPosition !== -1) {
                        console.log('🔄 用户继续向左拖动，重置加载标记')
                        lastLoadPosition = -1
                    }
                }
                
                // 清除之前的定时器
                if (movingResetTimer) {
                    clearTimeout(movingResetTimer)
                }
                
                // 500ms 后认为用户停止拖动
                movingResetTimer = setTimeout(function() {
                    userIsMoving = false
                    console.log('⏸️ 用户停止拖动，当前 start =', currentStart.toFixed(2) + '%')
                }, 500)
            }
            
            lastStartValue = currentStart
            
            // 🎯 渐进式预加载机制（仅在用户正在拖动时才允许触发加载）
            // 🔧 优化：提前预加载阈值，避免数据延迟和窗口跳跃
            if (hasMoreData && !isLoadingMore && userIsMoving) {
                var shouldLoad = false
                var triggerReason = ''
                
                if (currentStart < 40 && lastLoadPosition !== 40) {
                    shouldLoad = true
                    triggerReason = '预加载1(start < 40%)'
                    lastLoadPosition = 40
                } else if (currentStart < 60 && currentStart >= 40 && lastLoadPosition !== 60) {
                    shouldLoad = true
                    triggerReason = '预加载2(start < 60%)'
                    lastLoadPosition = 60
                }
                
                if (shouldLoad) {
                    console.log('🚀 触发加载更多：' + triggerReason + '，当前 start =', currentStart.toFixed(2) + '%')
                    isLoadingMore = true
                    loadMoreHistoryData(function(success) {
                        isLoadingMore = false
                        if (!success) {
                            hasMoreData = false
                            console.log('✅ 已到达最早数据')
                        }
                    })
                }
            }
        } catch(e) {
            // 忽略
        }
    }, 100)
}

// 页面加载完成后启动无限滚动检测
if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', startInfiniteScrollDetection)
} else {
    startInfiniteScrollDetection()
}

// ==================== 无限滚动加载逻辑 ====================

/**
 * 加载更多历史数据（真实API版本）
 * @param {Function} callback - 回调函数(success)
 */
function loadMoreHistoryData(callback) {
    console.log('开始加载更多历史数据...')
    
    // 检查是否有当前数据
    if (!allKlineData || allKlineData.length === 0) {
        console.warn('没有当前数据，无法加载更多')
        callback(false)
        return
    }
    
    // 获取最早的日期
    const earliestData = allKlineData[0]
    const beforeDate = earliestData.date  // 'YYYY-MM-DD' 格式
    
    // 🔧 构建API URL（添加use_mock参数）
    const useMockParam = useMockMode ? '&use_mock=true' : ''
    const url = `/api/v1/chart/data?index_id=${encodeURIComponent(currentIndex.id)}&period=${currentPeriod}&count=60&before=${beforeDate}&indicators=all${useMockParam}`
    console.log('📡 加载更多URL:', url)
    
    // 调用API
    fetch(url)
        .then(r => {
            // 检查HTTP状态码
            if (!r.ok) {
                throw new Error(`HTTP ${r.status}: ${r.statusText}`);
            }
            return r.json()
        })
        .then(res => {
            if (res.status !== 'success') {
                console.error('加载失败:', res.message)
                callback(false)
                return
            }
            
            const chartData = res.data || {}
            const newData = chartData.kline || []
            const newEvents = chartData.events || []
            const newIndicators = chartData.indicators || {}  // 🔧 新加载的指标数据
            
            // 检查是否有新数据
            if (newData.length === 0) {
                console.log('已到达最早数据')
                callback(false)
                return
            }
            
            // 合并数据（新数据插入到前面）
            const oldLength = allKlineData.length
            allKlineData = newData.concat(allKlineData)
            allEvents = newEvents.concat(allEvents)
            
            // 🔧 合并技术指标数据（将新指标插入到前面）
            for (const indicatorName in newIndicators) {
                if (allIndicatorsData[indicatorName]) {
                    allIndicatorsData[indicatorName] = newIndicators[indicatorName].concat(allIndicatorsData[indicatorName])
                } else {
                    allIndicatorsData[indicatorName] = newIndicators[indicatorName]
                }
            }
            
            console.log('✅ 加载成功：新增', newData.length, '条数据，总计', allKlineData.length, '条')
            
            // 🔧 仅更新图表数据，不重新渲染（避免视觉跳动）
            updateChartData(allKlineData, allEvents)
            
            // 调整 dataZoom 位置（保持视图不跳跃）
            adjustDataZoomAfterPrepend(oldLength, newData.length)
            
            callback(true)
        })
        .catch(err => {
            console.error('加载更多数据失败:', err)
            // 更详细的错误信息显示
            if (err instanceof TypeError && err.message.includes('fetch')) {
                showEmpty(klineChart, '网络连接失败，请检查网络设置')
            }
            callback(false)
        })
}

/**
 * 仅更新图表数据（不重新渲染，避免视觉跳动）
 * @param {Array} data - K线数据
 * @param {Array} events - 事件数据
 */
function updateChartData(data, events) {
    try {
        // 处理日期格式
        const processedData = data.map(d => {
            let dateStr = d.date
            if (typeof dateStr === 'string' && dateStr.includes('GMT')) {
                const dt = new Date(dateStr)
                dateStr = dt.toISOString().split('T')[0]
            }
            return { ...d, date: dateStr }
        })
        
        const displayEvents = events || []
        const ohlc = processedData.map(d => [d.open, d.close, d.low, d.high])
        const dates = processedData.map(d => d.date)
        
        // 🔧 关键优化：使用 lazyUpdate: true 延迟更新，不立即重绘
        klineChart.setOption({
            xAxis: { data: dates },
            series: [
                {
                    name: 'K线',
                    data: ohlc,
                    markPoint: {
                        data: displayEvents.map(e => {
                            let evtDate = e.date
                            if (typeof evtDate === 'string' && evtDate.includes('GMT')) {
                                evtDate = new Date(evtDate).toISOString().split('T')[0]
                            }
                            return {
                                name: e.title,
                                xAxis: evtDate,
                                yAxis: e.price || 0,
                                symbolSize: e.severity === 'critical' ? 60 : 40,
                                itemStyle: { color: e.impact === 'negative' ? '#ef4444' : '#10b981' }
                            }
                        })
                    }
                },
                { name: 'MA5', data: calcMA(processedData, 5) },
                { name: 'MA10', data: calcMA(processedData, 10) },
                { name: 'MA20', data: calcMA(processedData, 20) }
            ]
        }, { notMerge: false, lazyUpdate: true })  // 🔧 lazyUpdate: true 延迟更新
        
        // 同步更新指标图
        updateIndicatorData(processedData)
        
        // 🔧 同步更新数据窗口控制条的 xAxis 数据
        dataZoomChart.setOption({
            xAxis: { data: dates }
        }, { notMerge: false, lazyUpdate: true })
        
        console.log('🔄 已更新图表数据（延迟重绘），总计', processedData.length, '条')
    } catch(e) {
        console.error('更新图表数据失败:', e)
    }
}

/**
 * 仅更新指标图数据
 * @param {Array} processedData - 处理后的K线数据（仅用于 VOL）
 */
function updateIndicatorData(processedData) {
    try {
        const dates = processedData.map(d => d.date)
        
        if (currentIndicator === 'VOL') {
            indicatorChart.setOption({
                xAxis: { data: dates },
                series: [{ 
                    data: processedData.map(d => d.volume),
                    itemStyle: { 
                        color: (params) => {
                            // 根据当天涨跌上色（红涨绿跌）
                            // 🔧 引用全局变量 allKlineData 而不是闭包捕获的局部变量
                            const idx = params.dataIndex
                            if (!allKlineData || idx >= allKlineData.length) return '#64748b'
                            const data = allKlineData[idx]
                            if (!data || data.close === null || data.open === null) return '#64748b'
                            return data.close >= data.open ? '#ef4444' : '#10b981'
                        }
                    }
                }]
            }, { notMerge: false, lazyUpdate: true })
        } else if (currentIndicator === 'MACD') {
            // 🔧 使用后端计算的MACD数据
            const macdData = allIndicatorsData.macd || []
            const macdDates = macdData.map(d => d.date)
            const macdLine = macdData.map(d => d.macd)
            const signalLine = macdData.map(d => d.signal)
            const histogram = macdData.map(d => d.histogram)
            indicatorChart.setOption({
                xAxis: { data: macdDates },
                series: [
                    { name: 'DIFF', data: macdLine },
                    { name: 'DEA', data: signalLine },
                    { name: 'MACD柱', data: histogram }
                ]
            }, { notMerge: false, lazyUpdate: true })
        } else if (currentIndicator === 'RSI') {
            // 🔧 使用后端计算的RSI数据
            const rsiData = allIndicatorsData.rsi || []
            const rsiDates = rsiData.map(d => d.date)
            const rsi = rsiData.map(d => d.value)
            indicatorChart.setOption({
                xAxis: { data: rsiDates },
                series: [{ data: rsi }]
            }, { notMerge: false, lazyUpdate: true })
        } else if (currentIndicator === 'KDJ') {
            // 🔧 使用后端计算的KDJ数据
            const kdjData = allIndicatorsData.kdj || []
            const kdjDates = kdjData.map(d => d.date)
            const k = kdjData.map(d => d.k)
            const d = kdjData.map(d => d.d)
            const j = kdjData.map(d => d.j)
            indicatorChart.setOption({
                xAxis: { data: kdjDates },
                series: [
                    { name: 'K', data: k },
                    { name: 'D', data: d },
                    { name: 'J', data: j }
                ]
            }, { notMerge: false, lazyUpdate: true })
        } else if (currentIndicator === 'OBV') {
            // 🔧 使用后端计算的OBV数据
            const obvData = allIndicatorsData.obv || []
            const obvDates = obvData.map(d => d.date)
            const obv = obvData.map(d => d.value)
            indicatorChart.setOption({
                xAxis: { data: obvDates },
                series: [{ data: obv }]
            }, { notMerge: false, lazyUpdate: true })
        }
    } catch(e) {
        console.error('更新指标图数据失败:', e)
    }
}

// ⚠️ 已废弃前端计算函数，100%使用后端API返回的专业指标数据
// 原因：
// 1. 前端简化算法存在误差（EMA初始值、RSI平滑法、KDJ初始值等）
// 2. 数据不连续（初期null值导致图表断裂）
// 3. 与后端计算结果不一致，造成用户困惑
// 解决方案：所有技术指标由后端 indicator_service.py 统一计算（使用pandas专业库）

/**
 * 调整 dataZoom 位置（在数据前置后保持视图不跳跃）
 * @param {number} oldLength - 原数据长度
 * @param {number} prependLength - 前置数据长度
 */
function adjustDataZoomAfterPrepend(oldLength, prependLength) {
    try {
        const option = klineChart.getOption()
        if (!option.dataZoom || !option.dataZoom[0]) return
        
        const oldZoom = option.dataZoom[0]
        const newLength = oldLength + prependLength
        
        // 计算新的 start 和 end（百分比）
        // 原来的数据区间在新数组中的位置向后偏移
        const oldStartIndex = Math.floor((oldZoom.start || 0) / 100 * oldLength)
        const oldEndIndex = Math.floor((oldZoom.end || 100) / 100 * oldLength)
        
        const newStartIndex = oldStartIndex + prependLength
        const newEndIndex = oldEndIndex + prependLength
        
        const newStart = (newStartIndex / newLength) * 100
        const newEnd = (newEndIndex / newLength) * 100
        
        console.log('🎯 调整 dataZoom:', {
            old: { start: oldZoom.start?.toFixed(2) + '%', end: oldZoom.end?.toFixed(2) + '%', length: oldLength },
            new: { start: newStart.toFixed(2) + '%', end: newEnd.toFixed(2) + '%', length: newLength }
        })
        
        // 🔧 标记开始系统调整（避免被误判为用户拖动）
        if (typeof window.__dataZoomAdjusting === 'function') {
            window.__dataZoomAdjusting(true)
        }
        
        // 更新 dataZoom
        klineChart.dispatchAction({
            type: 'dataZoom',
            dataZoomIndex: 0,
            start: newStart,
            end: newEnd
        })
        
        // 同步到指标图
        indicatorChart.dispatchAction({
            type: 'dataZoom',
            dataZoomIndex: 0,
            start: newStart,
            end: newEnd
        })
        
        // 🔧 同步到数据窗口控制条
        dataZoomChart.dispatchAction({
            type: 'dataZoom',
            dataZoomIndex: 0,
            start: newStart,
            end: newEnd
        })
        
        // 🔧 150ms 后结束系统调整标记（给足够时间让轮询检测到）
        setTimeout(function() {
            if (typeof window.__dataZoomAdjusting === 'function') {
                window.__dataZoomAdjusting(false)
            }
        }, 150)
    } catch(e) {
        console.error('调整 dataZoom 失败:', e)
    }
}

function buildMarketSelector(markets) {
    const container = document.getElementById('marketSelector')
    container.innerHTML = ''
    markets.forEach((m, idx) => {
        const btn = document.createElement('button')
        btn.className = 'btn btn-segment'
        if (idx === 0) btn.classList.add('active')
        btn.textContent = m.name
        btn.onclick = () => {
            container.querySelectorAll('.btn-segment').forEach(b => b.classList.remove('active'))
            btn.classList.add('active')
            selectMarket(m)
        }
        container.appendChild(btn)
    })
}

function selectMarket(market) {
    currentMarket = market.id
    const indices = (market.default_indices || [])
    buildIndexList(indices)
    
    // 清除之前的错误状态，确保切换市场时能正常显示新数据
    if (klineChart) {
        // 清除图表中的错误提示
        klineChart.clear()
        // 显示加载状态
        klineChart.setOption({
            graphic: [{
                type: 'text',
                left: 'center',
                top: 'center',
                style: {
                    text: '加载中...',
                    fontSize: 16,
                    fill: '#999'
                }
            }]
        }, true);
    }
    
    // 💚 同时清除技术指标图（关键修复）
    if (indicatorChart) {
        indicatorChart.clear()
        // 显示加载状态
        indicatorChart.setOption({
            graphic: [{
                type: 'text',
                left: 'center',
                top: 'center',
                style: {
                    text: '加载中...',
                    fontSize: 16,
                    fill: '#999'
                }
            }]
        }, true);
    }
    
    if (indices.length) selectIndex(indices[0])
}

function buildIndexList(indices) {
    const list = document.getElementById('indexList')
    list.innerHTML = ''
    indices.forEach((item, idx) => {
        const row = document.createElement('div')
        row.className = 'list-item'
        if (idx === 0) row.classList.add('active')
        const content = document.createElement('div')
        content.className = 'list-item-content'
        const name = document.createElement('div')
        name.className = 'list-item-name'
        name.textContent = item.name
        const code = document.createElement('div')
        code.className = 'list-item-code'
        code.textContent = item.id
        content.appendChild(name)
        content.appendChild(code)
        row.appendChild(content)
        const actions = document.createElement('div')
        actions.className = 'list-item-actions'
        const delBtn = document.createElement('button')
        delBtn.className = 'btn-icon'
        delBtn.innerHTML = '✕'
        delBtn.title = '删除'
        delBtn.onclick = (e) => {
            e.stopPropagation()
            row.remove()
            if (currentIndex && currentIndex.id === item.id) {
                const remaining = list.querySelectorAll('.list-item')
                if (remaining.length) remaining[0].click()
                else showEmpty(klineChart, '暂无数据')
            }
        }
        actions.appendChild(delBtn)
        row.appendChild(actions)
        row.onclick = () => {
            list.querySelectorAll('.list-item').forEach(r => r.classList.remove('active'))
            row.classList.add('active')
            selectIndex(item)
        }
        list.appendChild(row)
    })
}

/**
 * 切换图表类型（K线图/分时图）
 */
function switchChartType(type) {
    currentChartType = type
    
    if (type === 'kline') {
        // 显示K线相关元素
        document.getElementById('periodSelector').style.display = 'flex'
        document.getElementById('klineChart').style.display = 'block'
        document.getElementById('intradayContainer').style.display = 'none'
        document.querySelector('.indicator-area').style.display = 'block'
        document.getElementById('dataZoomContainer').style.display = 'block'
        // 🔧 隐藏分时图的控制
        document.getElementById('intradayModeSelector').style.display = 'none'
        document.getElementById('intradayPhaseSelector').style.display = 'none'
        // 🔧 显示K线图的控制
        document.getElementById('klineModeSelector').style.display = 'block'
        // 默认隐藏K线的交易时段选择器（需要切换到Mock模式才显示）
        document.getElementById('klinePhaseSelector').style.display = 'none'
        
        // 🔧 停止分时图更新（使用独立模块）
        const timer = IntradayChart.getTimer()
        if (timer) {
            clearInterval(timer)
            IntradayChart.setTimer(null)
        }
        
        // 如果有当前选中的股票，重新加载K线数据
        if (currentIndex && allKlineData.length === 0) {
            loadKline(currentIndex.id)
        }
    } else if (type === 'intraday') {
        // 显示分时图相关元素
        document.getElementById('periodSelector').style.display = 'none'
        document.getElementById('klineChart').style.display = 'none'
        document.getElementById('intradayContainer').style.display = 'block'
        document.querySelector('.indicator-area').style.display = 'none'
        document.getElementById('dataZoomContainer').style.display = 'none'
        // 🔧 显示分时图的控制
        document.getElementById('intradayModeSelector').style.display = 'block'
        document.getElementById('intradayPhaseSelector').style.display = 'block'
        // 🔧 隐藏K线图的控制
        document.getElementById('klineModeSelector').style.display = 'none'
        document.getElementById('klinePhaseSelector').style.display = 'none'

function buildIndicatorSelector() {
    const container = document.getElementById('indicatorSelector')
    container.innerHTML = ''
    ;['VOL','MACD','RSI','KDJ','OBV'].forEach((ind, idx) => {
        const btn = document.createElement('button')
        btn.className = 'btn btn-segment'
        if (idx === 0) btn.classList.add('active')
        btn.textContent = ind
        btn.onclick = () => {
            container.querySelectorAll('.btn-segment').forEach(b => b.classList.remove('active'))
            btn.classList.add('active')
            currentIndicator = ind
            // 🔧 仅重新渲染指标图，不重新加载数据（使用 allKlineData）
            if (allKlineData && allKlineData.length > 0) {
                renderIndicator(allKlineData)
            }
        }
        container.appendChild(btn)
    })
}

function calcMA(data, period) {
    const result = []
    for (let i = 0; i < data.length; i++) {
        if (i < period - 1) { result.push('-'); continue }
        let sum = 0
        for (let j = i - period + 1; j <= i; j++) sum += data[j].close
        result.push((sum / period).toFixed(2))
    }
    return result
}

function renderKline(data, events) {
    console.log('renderKline called with data:', data, 'events:', events)
    if (!data || !data.length) {
        showEmpty(klineChart, '暂无数据')
        return
    }
    
    // 💚 关键修复: 先保存 dataZoom 位置,再清空图表
    // 🔧 保存当前 dataZoom 位置（避免重新渲染时复位）
    // ⚠️ 关键：如果是加载新股票，使用默认位置；如果是无限滚动，保留当前位置
    let currentZoom
    
    if (!isLoadingNewStock) {
        // 仅在非新股票加载时才保留位置（如无限滚动、切换指标等）
        try {
            const currentOption = klineChart.getOption()
            if (currentOption && currentOption.dataZoom && currentOption.dataZoom[0]) {
                currentZoom = {
                    start: currentOption.dataZoom[0].start || 0,
                    end: currentOption.dataZoom[0].end || 100
                }
                console.log('📍 保留当前 dataZoom 位置:', currentZoom)
            }
        } catch(e) {
            // 首次渲染时 getOption 可能失败，计算默认值
        }
    }
    
    // 如果没有保留的位置（新股票或首次加载），计算默认显示最近60天
    if (!currentZoom) {
        // 🔧 计算显示最近60天的dataZoom范围
        const totalDays = data.length
        const displayDays = 60  // 显示最近60天
        
        if (totalDays <= displayDays) {
            // 数据不足60天，显示全部
            currentZoom = { start: 0, end: 100 }
        } else {
            // 计算百分比：显示最后60天
            const startPercent = ((totalDays - displayDays) / totalDays) * 100
            currentZoom = { start: startPercent, end: 100 }
        }
        console.log(`🆕 加载新股票，显示最近${displayDays}天，dataZoom:`, currentZoom)
        isLoadingNewStock = false  // 重置标志
    }
    
    // 💚 现在清空图表(包括"加载中..."提示)
    klineChart.clear()
    
    // 处理日期格式（后端返回 GMT 格式，需转换为 YYYY-MM-DD）
    const processedData = data.map(d => {
        let dateStr = d.date
        if (typeof dateStr === 'string' && dateStr.includes('GMT')) {
            // 转换 "Wed, 03 Dec 2025 00:00:00 GMT" 为 "2025-12-03"
            const dt = new Date(dateStr)
            dateStr = dt.toISOString().split('T')[0]
        }
        return { ...d, date: dateStr }
    })
    
    // 默认显示全部120个周期的数据，但通过dataZoom控制初始视图
    const displayData = processedData
    const displayEvents = events || []
    
    const ohlc = displayData.map(d => [d.open, d.close, d.low, d.high])
    const dates = displayData.map(d => d.date)
    console.log('📊 renderKline - displayData数量:', displayData.length)
    console.log('Processed dates:', dates)
    console.log('OHLC data:', ohlc)
    const option = {
        title: { text: `${currentIndex?.name || ''} K线图`, left: 'center', textStyle: { fontSize: 14 } },
        tooltip: { trigger: 'axis', axisPointer: { type: 'cross' } },
        legend: { data: ['K线', 'MA5', 'MA10', 'MA20'], bottom: 0 },
        grid: { left: '8%', right: '8%', top: '15%', bottom: '12%' },
        xAxis: { type: 'category', data: dates, boundaryGap: true },
        yAxis: { scale: true },
        dataZoom: [
            { 
                type: 'inside',
                start: currentZoom.start,  // 🔧 使用保留的位置
                end: currentZoom.end,
                zoomOnMouseWheel: true,
                moveOnMouseMove: true,
                moveOnMouseWheel: true,
                throttle: 50
            }
            // 🔧 移除 slider 类型的 dataZoom，改为统一放在页面底部
        ],
        series: [
            {
                name:'K线',
                type:'candlestick',
                data: ohlc,
                itemStyle:{
                    color:'#ef4444',
                    color0:'#10b981',
                    borderColor:'#ef4444',
                    borderColor0:'#10b981'
                },
                markPoint: {
                    data: (displayEvents||[]).map(e => {
                        let evtDate = e.date
                        if (typeof evtDate === 'string' && evtDate.includes('GMT')) {
                            evtDate = new Date(evtDate).toISOString().split('T')[0]
                        }
                        return {
                            name: e.title,
                            xAxis: evtDate,
                            yAxis: e.price || 0,
                            symbolSize: e.severity==='critical'?60:40,
                            itemStyle: { color: e.impact === 'negative' ? '#ef4444' : '#10b981' }
                        }
                    })
                }
            },
            { 
                name:'MA5', 
                type:'line', 
                data: calcMA(displayData,5), 
                smooth:true, 
                symbol: 'none',  // 🔧 移除圆点
                lineStyle:{ opacity:0.6, color:'#f59e0b', width: 1.5 } 
            },
            { 
                name:'MA10', 
                type:'line', 
                data: calcMA(displayData,10), 
                smooth:true, 
                symbol: 'none',  // 🔧 移除圆点
                lineStyle:{ opacity:0.6, color:'#6366f1', width: 1.5 } 
            },
            {

        ]
    }
    console.log('Setting klineChart option:', option)
    // 💚 使用 true 完全替换配置,确保清除所有旧配置(包括graphic)
    klineChart.setOption(option, true)

// 实时K线全局变量
let realtimeKlineTimer = null
let currentRealtimeKline = null
let mockTradingPhase = 'TRADING'  // 🔧 模拟控制：BEFORE_OPEN, TRADING, AFTER_CLOSE
let useMockMode = false  // 是否使用mock模式

/**
 * 获取实时K线数据
 */
function fetchRealtimeKline() {
    if (!currentIndex || !currentIndex.id) return
    
    const indexId = currentIndex.id
    let url
    
    if (useMockMode) {
        // 🔧 Mock模式：前端显式传入trading_phase参数
        url = `/api/v1/data/kline/realtime/mock?index_id=${encodeURIComponent(indexId)}&trading_phase=${mockTradingPhase}`
        console.log('🎭 Mock模式 - 获取实时K线, trading_phase:', mockTradingPhase)
    } else {
        // 真实模式：后端自动判断时段
        url = `/api/v1/data/kline/realtime?index_id=${encodeURIComponent(indexId)}`
        console.log('🎯 真实模式 - 获取实时K线')
    }
    
    fetch(url)
        .then(r => r.json())
        .then(res => {
            if (res.status !== 'success') {
                console.warn('获取实时K线失败:', res.message)
                return
            }
            
            const realtimeData = res.data
            console.log('📊 实时K线数据:', realtimeData)
            
            // 更新实时K线
            currentRealtimeKline = realtimeData
            updateRealtimeKlineOnChart(realtimeData)
            
            // 根据should_poll决定是否继续轮询
            if (realtimeData.should_poll) {
                // 继续轮询（盘前或盘中）
                if (!realtimeKlineTimer) {
                    realtimeKlineTimer = setInterval(fetchRealtimeKline, 3000)  // 3秒轮询
                }
            } else {
                // 停止轮询（盘后）
                stopRealtimeKline()
            }
        })
        .catch(err => {
            console.error('获取实时K线失败:', err)
        })
}

/**
 * 更新实时K线到图表
 */
function updateRealtimeKlineOnChart(realtimeData) {
    if (!allKlineData || !allKlineData.length) return
    
    // 🔧 验证实时数据的完整性
    if (!realtimeData.date) {
        console.error('❌ 实时K线数据缺少date字段:', realtimeData)
        return
    }
    
    console.log('📊 更新实时K线:', {
        date: realtimeData.date,
        open: realtimeData.open,
        high: realtimeData.high,
        low: realtimeData.low,
        close: realtimeData.close,
        volume: realtimeData.volume
    })
    
    // 检查是否已存在当天数据
    const todayDate = realtimeData.date
    const existingIndex = allKlineData.findIndex(d => {
        let dateStr = d.date
        if (typeof dateStr === 'string' && dateStr.includes('GMT')) {
            dateStr = new Date(dateStr).toISOString().split('T')[0]
        }
        return dateStr === todayDate
    })
    
    if (existingIndex >= 0) {
        // 更新已存在的当天K线（直接使用后端返回的数据）
        allKlineData[existingIndex] = {
            date: todayDate,
            open: realtimeData.open,
            high: realtimeData.high,   // 后端已维护历史最高价
            low: realtimeData.low,     // 后端已维护历史最低价
            close: realtimeData.close,
            volume: realtimeData.volume
        }
    } else {
        // 添加新的当天K线
        allKlineData.push({
            date: todayDate,
            open: realtimeData.open,
            high: realtimeData.high,
            low: realtimeData.low,
            close: realtimeData.close,
            volume: realtimeData.volume
        })
    }
    
    // 更新图表数据（不重新渲染）
    updateChartData(allKlineData, allEvents)
}

/**
 * 停止实时K线轮询
 */
function stopRealtimeKline() {
    if (realtimeKlineTimer) {
        clearInterval(realtimeKlineTimer)
        realtimeKlineTimer = null
        console.log('⏸️ 停止实时K线轮询')
    }
}

/**
 * 启动实时K线（选择股票时调用）
 */
function startRealtimeKline() {
    stopRealtimeKline()  // 先停止之前的轮询
    currentRealtimeKline = null
    
    // 立即获取一次
    fetchRealtimeKline()
}

/**
 * 切换模拟时段
 */
function setMockTradingPhase(phase) {
    mockTradingPhase = phase
    console.log('🎭 切换模拟时段:', phase)
    
    // 更新按钮状态
    document.querySelectorAll('.mock-phase-btn').forEach(btn => {
        btn.classList.remove('active')
    })
    document.querySelector(`[data-phase="${phase}"]`)?.classList.add('active')
    
    // 重新获取实时K线
    if (useMockMode && currentIndex && currentIndex.id) {
        fetchRealtimeKline()
    }
}

function loadKline(indexId) {
    console.log('loadKline called with indexId:', indexId, 'period:', currentPeriod)
    
    // 🔧 停止之前的实时K线轮询
    stopRealtimeKline()
    
    // 🔧 标记正在加载新股票（需要复位 dataZoom 到默认位置）
    isLoadingNewStock = true
    
    // 💚 性能优化: A股默认60条,其他市场120条
    const count = currentMarket === 'cn_stock' ? 60 : 120
    
    // 🔧 添加use_mock参数，统一切换数据源
    const useMockParam = useMockMode ? '&use_mock=true' : ''
    const url = `/api/v1/chart/data?index_id=${encodeURIComponent(indexId)}&period=${currentPeriod}&count=${count}&indicators=all${useMockParam}`
    console.log('Fetching:', url)
    fetch(url)
        .then(r => {
            console.log('Response received:', r.status)
            // 检查HTTP状态码
            if (!r.ok) {
                throw new Error(`HTTP ${r.status}: ${r.statusText}`);
            }
            return r.json()
        })
        .then(res => {
            console.log('JSON parsed:', res)
            if (res.status !== 'success') {
                console.error('API returned error:', res)
                showEmpty(klineChart, '加载失败: ' + (res.message || '未知错误'))
                return
            }
            const chartData = res.data || {}
            const data = chartData.kline || []
            console.log('Data length:', data.length)
            if (!data.length) {
                showEmpty(klineChart, '暂无数据')
                return
            }
            
            // 存储到全局变量（用于无限滚动）
            allKlineData = data
            allEvents = chartData.events || []
            allIndicatorsData = chartData.indicators || {}  // 🔧 保存后端计算的指标数据
            
            console.log('🎯 后端指标数据:', allIndicatorsData)
            
            renderKline(allKlineData, allEvents)
            
            // 🔧 启动实时K线（仅限日线周期）
            if (currentPeriod === 'daily') {
                setTimeout(() => startRealtimeKline(), 500)  // 延迟启动，避免与图表渲染冲突
            }
        })
        .catch(err => {
            console.error('Fetch error:', err)
            // 更详细的错误信息显示
            if (err instanceof TypeError && err.message.includes('fetch')) {
                showEmpty(klineChart, '网络连接失败，请检查网络设置')
            } else {
                showEmpty(klineChart, '加载失败: ' + err.message)
            }
        })
}

    const tbody = document.getElementById('orderBookBody')
    if (tbody) {
        tbody.innerHTML = `<tr><td colspan="3" style="text-align:center; padding:20px; color:#ef4444;">${message}</td></tr>`
    }
    
    const tickerList = document.getElementById('tickerList')
    if (tickerList) {
        tickerList.innerHTML = `<div style="text-align:center; padding:20px; color:#ef4444;">${message}</div>`
    }
}

/**
 * 加载分时图数据
 * @param {string} symbol - 证券代码
 * @param {boolean} isInitial - 是否首次加载（true=全量，false=增量）
 */

/**
 * 🔧 判断是否处于交易时段（根据市场）
 */
// 🔧 删除：isTradingTime() - 前端不再判断交易时段，完全依赖后端 should_poll

function loadIntradayData(symbol, isInitial = true) {
    
    // 🔧 只有首次加载才清空旧数据和显示加载状态
    if (isInitial) {
        IntradayChart.setData(null)
        IntradayChart.showLoading(true)
        IntradayChart.setBatchIndex(0)  // 重置批次序号
        IntradayChart.setRequestTime(0)  // 重置时间
        
        // 🎮 模拟模式：初始化虚拟时间为 09:30:00
        const mode = IntradayChart.getMode()
        if (mode === 'mock') {
            const virtualStartTime = '2024-12-14 09:30:00'
            IntradayChart.setVirtualTime(virtualStartTime)
        }
    }
    
    // 🔧 计算 TickRange（时间范围）
    const mode = IntradayChart.getMode()
    let currentTime
    
    if (mode === 'mock') {
        // 🎮 模拟模式：使用虚拟时间（每次递增1分钟）
        if (isInitial) {
            // 首次加载：使用已设置的虚拟时间 (09:30:00)
            currentTime = IntradayChart.getVirtualTime()
        } else {
            // 增量更新：虚拟时间递增 1 分钟
            const lastVirtualTime = IntradayChart.getVirtualTime()
            // 🔧 直接字符串操作：解析时间并增加 1 分钟
            const [date, time] = lastVirtualTime.split(' ')
            const [hours, minutes, seconds] = time.split(':').map(Number)
            const totalMinutes = hours * 60 + minutes + 1  // +1分钟
            const newHours = Math.floor(totalMinutes / 60)
            const newMinutes = totalMinutes % 60
            currentTime = `${date} ${String(newHours).padStart(2, '0')}:${String(newMinutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`
            IntradayChart.setVirtualTime(currentTime)
        }
    } else {
        // 📊 真实模式：使用系统实际时间
        currentTime = Math.floor(Date.now() / 1000)  // 当前时间（秒）
    }
    
    // 🔧 构建 TickRange 对象
    // 规则：
    // 1. 模拟模式：盘中时始终生成（首次+增量）
    // 2. 真实模式：只在增量更新时生成（有 lastRequestTime）
    let tickRange = null
    const lastRequestTime = IntradayChart.getRequestTime()
    
    let simulationMode = window.selectedTradingPhase || 'trading'
    
    // 🔧 判断是否生成 TickRange
    // 模拟模式：盘中时始终生成
    // 真实模式：只在增量更新时生成（有 lastRequestTime）
    const shouldGenerateTickRange = (mode === 'mock' && simulationMode === 'trading')
                                    || (mode === 'real' && !isInitial && lastRequestTime)
    
    if (shouldGenerateTickRange) {
        if (isInitial) {
            // 🎯 首次加载：加载约 1 小时的数据（09:30 ~ 10:30）
            const startTime = currentTime  // 当前虚拟时间："2024-12-14 09:30:00"
            // 🔧 计算 1 小时后的时间
            const [date, time] = currentTime.split(' ')
            const [hours, minutes, seconds] = time.split(':').map(Number)
            const endHours = hours + 1  // +1小时
            const endTime = `${date} ${String(endHours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`
            
            tickRange = {
                start_time: startTime,
                end_time: endTime,
                period_seconds: 5
            }
            
            IntradayChart.setVirtualTime(endTime)
            IntradayChart.setRequestTime(endTime)
        } else {
            // 🎯 增量更新：每次增加 1 分钟（从上次结束时间到新的结束时间）
            const lastRequestTime = IntradayChart.getRequestTime()
            let newStartTime, newEndTime
            
            if (mode === 'mock') {
                // 模拟模式：使用虚拟时间
                newStartTime = lastRequestTime  // 从上次结束时间开始
                newEndTime = currentTime  // 到当前虚拟时间
            } else {
                // 🔧 真实模式：使用系统时间戳转换为格式化时间
                const now = new Date()
                const dateStr = now.toISOString().split('T')[0]  // YYYY-MM-DD
                const timeStr = now.toTimeString().split(' ')[0]  // HH:MM:SS
                newEndTime = `${dateStr} ${timeStr}`
                
                // 如果有lastRequestTime，使用它；否则使用开盘时间
                if (lastRequestTime) {
                    newStartTime = lastRequestTime
                } else {
                    // 首次增量更新，从开盘到现在
                    newStartTime = `${dateStr} 09:30:00`
                }
            }
            
            tickRange = {
                start_time: newStartTime,
                end_time: newEndTime,
                period_seconds: 5
            }
            IntradayChart.setRequestTime(newEndTime)
        }
    }
    
    let url
    if (mode === 'mock') {
        // 模拟模式：调用 /api/v1/intraday/mock
        url = `/api/v1/intraday/mock?symbol=${encodeURIComponent(symbol)}&trading_phase=${simulationMode}`
        
        // 🔧 传递last_price（用于保证价格连续性）
        const intradayData = IntradayChart.getData()
        if (intradayData && intradayData.current_price) {
            url += `&last_price=${intradayData.current_price}`
        }
    } else {
        // 真实模式：调用 /api/v1/intraday/data
        url = `/api/v1/intraday/data?symbol=${encodeURIComponent(symbol)}`
    }
    
    if (tickRange) {
        url += `&tick_range=${encodeURIComponent(JSON.stringify(tickRange))}`
    }
    
    fetch(url)
        .then(r => {
            // 无论状态码如何，都尝试解析JSON
            return r.json().then(data => {
                if (!r.ok) {
                    // HTTP错误状态码（4xx, 5xx）
                    throw new Error(data.message || `HTTP ${r.status}: ${r.statusText}`)
                }
                return data
            })
        })
        .then(res => {
            if (res.status !== 'success') {
                console.error('加载失败:', res.message)
                if (isInitial) {
                    showIntradayError('加载失败: ' + res.message)
                }
                return
            }
            
            if (isInitial) {
                IntradayChart.setData(res.data)
                
                if (res.data.times && res.data.times.length > 0) {
                    const lastTime = res.data.times[res.data.times.length - 1]
                    if (mode === 'real') {
                        // 真实模式：记录完整时间戳（日期+时间）
                        const now = new Date()
                        const dateStr = now.toISOString().split('T')[0]
                        const lastRequestTime = `${dateStr} ${lastTime}`
                        IntradayChart.setRequestTime(lastRequestTime)
                    }
                }
                
                renderIntradayCharts(res.data)

                const timer = IntradayChart.getTimer()
                if (timer) {
                    clearInterval(timer)
                    IntradayChart.setTimer(null)
                }
                
                // 🔧 mode 已经在上面定义，不需要重复定义
                
                if (res.data.should_poll) {
                    const pollInterval = mode === 'mock' ? 5000 : 1000
                    const newTimer = setInterval(() => {
                        if (currentChartType === 'intraday' && currentIndex) {
                            loadIntradayData(currentIndex.id, false)
                        }
                    }, pollInterval)
                    IntradayChart.setTimer(newTimer)
                }
                
                // 🔧 如果不是指数，更新盘口和成交明细（等待DOM渲染完成）
                if (!res.data.is_index) {
                    // 使用 setTimeout 确保DOM元素已经完全创建
                    setTimeout(() => {
                        updateOrderBook(res.data.order_book)
                        updateTicker(res.data.trade_records)
                    }, 50)
                }
                
                // 🔧 布局变化后，需要 resize 图表
                setTimeout(() => {
                    const charts = IntradayChart.getCharts()
                    if (charts.price) charts.price.resize()
                    if (charts.volume) charts.volume.resize()
                }, 50)
                
                showIntradayLoading(false)
            } else {
                const intradayData = IntradayChart.getData()
                if (!intradayData) {
                    return
                }
                
                if (intradayData.times && intradayData.times.length > 0 && 
                    res.data.times && res.data.times.length > 0) {
                    const lastTime = intradayData.times[intradayData.times.length - 1]
                    const newLastTime = res.data.times[res.data.times.length - 1]
                    if (lastTime === newLastTime) {
                        return
                    }
                }
                
                intradayData.current_price = res.data.current_price
                intradayData.change = res.data.change
                intradayData.change_percent = res.data.change_percent
                
                updateIntradayChartsIncremental(res.data)
                
                if (!res.data.is_index) {
                    updateOrderBook(res.data.order_book)
                    updateTicker(res.data.trade_records)
                }
            }
        })
        .catch(err => {
            console.error('加载分时数据失败:', err)
            if (isInitial) {
                showIntradayError('加载失败: ' + err.message)
            }
        })
}

/**
 * 渲染分时图表
 */
function renderIntradayCharts(data) {
    if (!data) {
        console.error('❌ renderIntradayCharts: 数据为null')
        return
    }
    
    // 🔧 关键修复：盘前时段（times为空）也要渲染空的图表框架
    const hasTicks = data.times && data.times.length > 0
    if (!hasTicks) {
        console.log('🕒 盘前或无数据时段，渲染空的分时图框架')
    }
    
    const yesterdayClose = parseFloat(data.yesterday_close)
    const currentPrice = parseFloat(data.current_price)
    const change = parseFloat(data.change)
    const changePercent = parseFloat(data.change_percent)
    
    // 🔧 生成完整交易时段的时间轴（固定周期，5秒级别，排除午休时间）
    const fullTradingTimes = []
    // 上午: 09:30:00-11:30:00，每5秒一个点
    for (let h = 9; h <= 11; h++) {
        const startMin = h === 9 ? 30 : 0
        const endMin = h === 11 ? 30 : 59
        for (let m = startMin; m <= endMin; m++) {
            for (let s = 0; s < 60; s += 5) {
                const timeStr = `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`
                fullTradingTimes.push(timeStr)
            }
        }
    }
    // 下午: 13:00:00-15:00:00，每5秒一个点
    for (let h = 13; h <= 15; h++) {
        const endMin = h === 15 ? 0 : 59
        for (let m = 0; m <= endMin; m++) {
            for (let s = 0; s < 60; s += 5) {
                const timeStr = `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`
                fullTradingTimes.push(timeStr)
            }
        }
    }
    console.log(`🕒 生成完整时间轴: ${fullTradingTimes.length}个点位`)
    const priceData = new Array(fullTradingTimes.length).fill(null)
    const avgPriceData = new Array(fullTradingTimes.length).fill(null)
    const volumeData = new Array(fullTradingTimes.length).fill(null)
    
    // 🔧 关键修复：只有hasTicks为true时才映射数据（盘前为空）
    if (hasTicks) {
        data.times.forEach((time, idx) => {
            const timeIndex = fullTradingTimes.indexOf(time)
            if (timeIndex !== -1) {
                // 🔧 关键修复：强制转换为数字类型，并验证有效性
                const price = parseFloat(data.prices[idx])
                const avgPrice = parseFloat(data.avg_prices[idx])
                const volume = parseInt(data.volumes[idx])
                
                // 只有有效数字才赋值
                if (!isNaN(price) && isFinite(price)) {
                    priceData[timeIndex] = price
                }
                if (!isNaN(avgPrice) && isFinite(avgPrice)) {
                    avgPriceData[timeIndex] = avgPrice
                }
                if (!isNaN(volume) && isFinite(volume)) {
                    volumeData[timeIndex] = volume
                }
            }
        })
    }
    
    const charts = IntradayChart.getCharts()
    
    if (!charts.price) {
        console.error('❌ 价格图表实例为空，无法渲染！')
        return
    }
    if (!charts.volume) {
        console.error('❌ 成交量图表实例为空，无法渲染！')
        return
    }
    
    charts.price.clear()
    charts.volume.clear()
    
    charts.price.setOption({
        title: {
            text: (currentIndex ? currentIndex.name : '') + ' 分时图',
            left: 'center',
            textStyle: { fontSize: 14 },
            subtext: `昨收: ${yesterdayClose.toFixed(2)}  现价: ${currentPrice.toFixed(2)}  涨跌: ${change >= 0 ? '+' : ''}${change.toFixed(2)} (${changePercent.toFixed(2)}%)`,
            subtextStyle: { 
                fontSize: 11, 
                color: change >= 0 ? '#ef4444' : '#10b981' 
            }
        },
        tooltip: {
            trigger: 'axis',
            formatter: function(params) {
                let result = params[0].axisValue + '<br/>'
                params.forEach(item => {
                    // 🔧 处理null值
                    if (item.value === null || item.value === undefined) {
                        return
                    }
                    const value = parseFloat(item.value)
                    const change = value - yesterdayClose
                    const changePercent = (change / yesterdayClose * 100).toFixed(2)
                    result += item.marker + item.seriesName + ': ' + value.toFixed(2) + 
                             ` (${change >= 0 ? '+' : ''}${change.toFixed(2)}, ${changePercent}%)<br/>`
                })
                return result
            }
        },
        grid: { left: '50px', right: '50px', top: '60px', bottom: '30px' },
        xAxis: {
            type: 'category',
            data: fullTradingTimes,  // 🔧 使用完整交易时段
            boundaryGap: false,
            axisLabel: {
                interval: 'auto',  // 🔧 自动间隔，避免标签重叠
                formatter: function(value) {
                    // 只显示整分钟的标签（HH:MM:00）
                    if (value.endsWith(':00')) {
                        return value.substring(0, 5)  // 去掉秒，显示HH:MM
                    }
                    return ''  // 非整分钟不显示
                }
            }
        },
        yAxis: {
            type: 'value',
            scale: true,
            // 🔧 关键修复：以昨收价为中心点，确保昨收线在图表中间
            min: function(value) {
                // 计算价格范围与昨收价的最大偏离
                const dataMin = value.min
                const dataMax = value.max
                const maxOffset = Math.max(Math.abs(dataMax - yesterdayClose), Math.abs(yesterdayClose - dataMin))
                // 以昨收为中心，对称设置 Y 轴范围
                return yesterdayClose - maxOffset * 1.1  // 1.1 留出 10% 的边距
            },
            max: function(value) {
                const dataMin = value.min
                const dataMax = value.max
                const maxOffset = Math.max(Math.abs(dataMax - yesterdayClose), Math.abs(yesterdayClose - dataMin))
                return yesterdayClose + maxOffset * 1.1
            },
            splitLine: {
                lineStyle: { type: 'dashed', color: '#e5e7eb' }
            },
            axisLine: { onZero: false }
        },
        series: [
            {
                name: '价格',
                type: 'line',
                data: priceData,  // 🔧 使用映射后的数据
                smooth: 0.6,  // 🔧 关键修复：增加平滑系数到0.6，更平滑的曲线
                symbol: 'none',
                showSymbol: false,  // 🔧 不显示数据点标记
                lineStyle: { width: 2 },  // 🔧 增加线宽，让平滑效果更明显
                itemStyle: { color: '#2563eb' },
                areaStyle: {
                    color: {
                        type: 'linear',
                        x: 0, y: 0, x2: 0, y2: 1,
                        colorStops: [
                            { offset: 0, color: 'rgba(37, 99, 235, 0.3)' },
                            { offset: 1, color: 'rgba(37, 99, 235, 0.05)' }
                        ]
                    }
                },
                connectNulls: true,  // 🔧 连接null值，否则数据太稀疏无法显示
                markLine: {
                    symbol: 'none',
                    silent: false,
                    animation: false,
                    data: [
                        {
                            // 🔧 昨收横线
                            yAxis: yesterdayClose,
                            label: { 
                                show: true,
                                formatter: '昨收: {c}',
                                position: 'end',
                                color: '#6b7280',
                                fontSize: 11
                            },
                            lineStyle: { 
                                color: '#9ca3af', 
                                type: 'dashed', 
                                width: 2,  // 🔧 加粗昨收线
                                opacity: 0.9
                            }
                        },
                        {
                            // 🔧 11:30 午盘分割线（上午收盘）
                            xAxis: '11:30:00',
                            label: { 
                                show: false
                            },
                            lineStyle: { 
                                color: '#9ca3af',  // 🔧 加深颜色
                                type: 'solid', 
                                width: 2,  // 🔧 加粗
                                opacity: 0.8  // 🔧 增加不透明度
                            }
                        },
                        {
                            // 🔧 13:00 午盘分割线（下午开盘）
                            xAxis: '13:00:00',
                            label: { 
                                show: false
                            },
                            lineStyle: { 
                                color: '#9ca3af',  // 🔧 加深颜色
                                type: 'solid', 
                                width: 2,  // 🔧 加粗
                                opacity: 0.8  // 🔧 增加不透明度
                            }
                        }
                    ]
                },
            },
            {
                name: '均价',
                type: 'line',
                data: avgPriceData,  // 🔧 使用映射后的数据
                smooth: 0.6,  // 🔧 增加平滑系数
                symbol: 'none',
                showSymbol: false,
                lineStyle: { width: 1.5, color: '#f59e0b', type: 'dashed' },
                connectNulls: true  // 🔧 连接null值
            }
        ]
    }, true)  // 🔧 关键：使用true完全替换配置，清除graphic
    
    // 渲染成交量
    charts.volume.setOption({
        title: { text: '成交量', left: 'center', textStyle: { fontSize: 12 } },
        tooltip: {
            trigger: 'axis',
            formatter: function(params) {
                if (!params || params.length === 0) return ''
                const volume = params[0].value
                // 🔧 处理null值
                if (volume === null || volume === undefined) {
                    return params[0].axisValue + '<br/>' + params[0].marker + '成交量: 无数据'
                }
                return params[0].axisValue + '<br/>' + params[0].marker + '成交量: ' + volume.toLocaleString() + '手'
            }
        },
        grid: { left: '50px', right: '50px', top: '40px', bottom: '20px' },
        xAxis: {
            type: 'category',
            data: fullTradingTimes,  // 🔧 使用完整交易时段
            show: false
        },
        yAxis: {
            type: 'value',
            splitLine: { lineStyle: { type: 'dashed', color: '#e5e7eb' } }
        },
        series: [{
            type: 'bar',
            data: volumeData,  // 🔧 使用映射后的数据
            itemStyle: {
                color: (params) => {
                    const idx = params.dataIndex
                    if (idx === 0 || !priceData[idx] || !priceData[idx - 1]) return '#64748b'
                    const currentPrice = parseFloat(priceData[idx])
                    const prevPrice = parseFloat(priceData[idx - 1])
                    return currentPrice >= prevPrice ? '#ef4444' : '#10b981'
                }
            },
            barWidth: '80%'
        }]
    }, true)  // 🔧 关键：使用true完全替换配置，清除graphic
    
    console.log('✅ 成交量图表setOption完成')
}

/**
 * 增量更新分时图表（不重新渲染，只更新数据）
 * @param {Object} newData - 最新的分时数据
 */
function updateIntradayChartsIncremental(newData) {
    if (!intradayData || !newData) return
    
    // 🔧 关键：昨收价格从首次加载的 intradayData 中获取，不使用 newData
    const yesterdayClose = parseFloat(intradayData.yesterday_close)
    
    const hasNewData = newData.times && newData.times.length > 0
    
    let currentPrice, change, changePercent
    if (hasNewData) {
        // 有新数据：使用 newData 的价格
        currentPrice = parseFloat(newData.current_price)
        change = parseFloat(newData.change)
        changePercent = parseFloat(newData.change_percent)
    } else {
        // 无新数据：保持 intradayData 的原价格
        currentPrice = parseFloat(intradayData.current_price)
        change = parseFloat(intradayData.change)
        changePercent = parseFloat(intradayData.change_percent)
        console.log('⚠️ 增量更新无新数据，保持原价格:', currentPrice)
    }
    
    // 🔧 生成完整交易时段（与 renderIntradayCharts 相同，5秒级别）
    const fullTradingTimes = []
    for (let h = 9; h <= 11; h++) {
        const startMin = h === 9 ? 30 : 0
        const endMin = h === 11 ? 30 : 59
        for (let m = startMin; m <= endMin; m++) {
            for (let s = 0; s < 60; s += 5) {
                fullTradingTimes.push(`${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`)
            }
        }
    }
    for (let h = 13; h <= 15; h++) {
        const endMin = h === 15 ? 0 : 59
        for (let m = 0; m <= endMin; m++) {
            for (let s = 0; s < 60; s += 5) {
                fullTradingTimes.push(`${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`)
            }
        }
    }
    
    if (hasNewData) {
        newData.times.forEach((time, idx) => {
            // 检查是否已存在（避免重复）
            if (!intradayData.times.includes(time)) {
                intradayData.times.push(time)
                intradayData.prices.push(newData.prices[idx])
                intradayData.avg_prices.push(newData.avg_prices[idx])
                intradayData.volumes.push(newData.volumes[idx])
            }
        })
    }
    
    const priceData = new Array(fullTradingTimes.length).fill(null)
    const avgPriceData = new Array(fullTradingTimes.length).fill(null)
    const volumeData = new Array(fullTradingTimes.length).fill(null)
    
    intradayData.times.forEach((time, idx) => {
        const timeIndex = fullTradingTimes.indexOf(time)
        if (timeIndex !== -1) {
            priceData[timeIndex] = intradayData.prices[idx]
            avgPriceData[timeIndex] = intradayData.avg_prices[idx]
            volumeData[timeIndex] = intradayData.volumes[idx]
        }
    })
    
    const priceOption = {
        title: {
            subtext: `昨收: ${yesterdayClose.toFixed(2)}  现价: ${currentPrice.toFixed(2)}  涨跌: ${change >= 0 ? '+' : ''}${change.toFixed(2)} (${changePercent.toFixed(2)}%)`,
            subtextStyle: { 
                fontSize: 11, 
                color: change >= 0 ? '#ef4444' : '#10b981' 
            }
        },
        series: [
            { 
                data: priceData,
                // 🔧 关键：增量更新时也要设置 markLine，配置必须与首次渲染完全一致
                markLine: {
                    symbol: 'none',
                    silent: false,
                    animation: false,
                    data: [
                        {
                            // 🔧 昨收横线
                            yAxis: yesterdayClose,
                            label: { 
                                show: true,
                                formatter: '昨收: {c}',
                                position: 'end',
                                color: '#6b7280',
                                fontSize: 11
                            },
                            lineStyle: { 
                                color: '#9ca3af', 
                                type: 'dashed', 
                                width: 2,
                                opacity: 0.9
                            }
                        },
                        {
                            // 🔧 11:30 午盘分割线
                            xAxis: '11:30:00',
                            label: { show: false },
                            lineStyle: { 
                                color: '#9ca3af',  // 🔧 加深颜色
                                type: 'solid', 
                                width: 2,  // 🔧 加粗
                                opacity: 0.8  // 🔧 增加不透明度
                            }
                        },
                        {
                            // 🔧 13:00 午盘分割线
                            xAxis: '13:00:00',
                            label: { show: false },
                            lineStyle: { 
                                color: '#9ca3af',  // 🔧 加深颜色
                                type: 'solid', 
                                width: 2,  // 🔧 加粗
                                opacity: 0.8  // 🔧 增加不透明度
                            }
                        }
                    ]
                }
            },
            { data: avgPriceData }
        ]
    }
    
    const volumeOption = {
        series: [{
            type: 'bar',  // 🔧 添加 type，确保 ECharts 能识别
            data: volumeData,
            itemStyle: {
                color: (params) => {
                    const idx = params.dataIndex
                    if (idx === 0 || !priceData[idx] || !priceData[idx - 1]) return '#64748b'
                    const currentPrice = parseFloat(priceData[idx])
                    const prevPrice = parseFloat(priceData[idx - 1])
                    return currentPrice >= prevPrice ? '#ef4444' : '#10b981'
                }
            },
            barWidth: '80%'  // 🔧 添加 barWidth
        }]
    }
    
    console.log(`📦 volumeOption配置:`, JSON.stringify(volumeOption).substring(0, 200))
    
    // 🔧 关键：验证图表实例是否有效
    if (!intradayPriceChart || !intradayVolumeChart) {
        console.error('❌ 图表实例无效，尝试重新初始化')
        intradayPriceChart = echarts.init(document.getElementById('intradayPriceChart'))
        intradayVolumeChart = echarts.init(document.getElementById('intradayVolumeChart'))
        echarts.connect([intradayPriceChart, intradayVolumeChart])
    }
    
    // 🔧 检查图表是否已被销毁
    if (intradayVolumeChart.isDisposed && intradayVolumeChart.isDisposed()) {
        console.error('❌ 成交量图表已被销毁，重新初始化')
        intradayVolumeChart = echarts.init(document.getElementById('intradayVolumeChart'))
        echarts.connect([intradayPriceChart, intradayVolumeChart])
    }
    
    requestAnimationFrame(() => {
        try {
            intradayPriceChart.setOption(priceOption)
            intradayVolumeChart.setOption(volumeOption, { replaceMerge: ['series'] })
        } catch (error) {
            console.error('❌ 图表更新失败:', error)
            // 尝试重新初始化
            intradayVolumeChart = echarts.init(document.getElementById('intradayVolumeChart'))
            echarts.connect([intradayPriceChart, intradayVolumeChart])
            intradayVolumeChart.setOption(volumeOption, { replaceMerge: ['series'] })
        }
    })
}

/**
 * 更新买卖盘口
 */
function updateOrderBook(orderBook) {
    if (!orderBook) return
    
    const tbody = document.getElementById('orderBookBody')
    if (!tbody) {
        console.warn('⚠️ orderBookBody 元素不存在，跳过盘口更新（可能是指数布局）')
        return
    }
    tbody.innerHTML = ''
    
    // 🔧 使用后端返回的提示信息（而非前端判断）
    if (!orderBook.bids || orderBook.bids.length === 0) {
        // 获取后端返回的提示信息
        const message = orderBook.message || '无盘口数据'
        tbody.innerHTML = `
            <tr>
                <td colspan="3" style="text-align:center; padding:20px; color:#9ca3af;">
                    <div style="font-size:13px;">${message}</div>
                </td>
            </tr>
        `
        return
    }
    
    // 倒序显示卖单（从卖五到卖一）
    const sellCount = Math.min(5, orderBook.asks.length)
    for (let i = orderBook.asks.length - 1, idx = 0; i >= 0 && idx < sellCount; i--, idx++) {
        const ask = orderBook.asks[i]
        const sellNum = sellCount - idx  // 卖五、卖四、...、卖一
        const tr = document.createElement('tr')
        tr.innerHTML = `
            <td style="padding:4px; text-align:left; color:#10b981; font-size:10px;">卖${sellNum}</td>
            <td style="padding:4px; text-align:center; color:#10b981; font-weight:500;">${ask.price.toFixed(2)}</td>
            <td style="padding:4px; text-align:right; color:#10b981;">${ask.volume}</td>
        `
        tbody.appendChild(tr)
    }
    
    // 分割线
    const divider = document.createElement('tr')
    divider.innerHTML = '<td colspan="3" style="padding:8px 4px; text-align:center; background:#f3f4f6; font-size:10px; color:#9ca3af;">--------</td>'
    tbody.appendChild(divider)
    
    // 正序显示买单（从买一到买五）
    const buyCount = Math.min(5, orderBook.bids.length)
    for (let i = 0; i < buyCount; i++) {
        const bid = orderBook.bids[i]
        const buyNum = i + 1  // 买一、买二、...、买五
        const tr = document.createElement('tr')
        tr.innerHTML = `
            <td style="padding:4px; text-align:left; color:#ef4444; font-size:10px;">买${buyNum}</td>
            <td style="padding:4px; text-align:center; color:#ef4444; font-weight:500;">${bid.price.toFixed(2)}</td>
            <td style="padding:4px; text-align:right; color:#ef4444;">${bid.volume}</td>
        `
        tbody.appendChild(tr)
    }
}

/**
 * 更新成交明细
 */
function updateTicker(tickersData) {
    if (!tickersData) return
    
    const container = document.getElementById('tickerList')
    if (!container) {
        console.warn('⚠️ tickerList 元素不存在，跳过成交明细更新（可能是指数布局）')
        return
    }
    
    // 🔧 从新的数据结构中获取tickers和message
    const trade_records = tickersData.items || []
    const message = tickersData.message || '无成交明细'
    
    if (trade_records.length === 0) {
        container.innerHTML = `
            <div style="text-align:center; padding:20px; color:#9ca3af;">
                <div style="font-size:13px;">${message}</div>
            </div>
        `
        return
    }
    
    container.innerHTML = ''
    
    // ... existing code ...
    trade_records.forEach(tick => {
        const div = document.createElement('div')
        div.style.cssText = 'display:flex; justify-content:space-between; padding:3px 0; border-bottom:1px solid #f3f4f6;'
        const color = tick.type === 'buy' ? '#ef4444' : '#10b981'
        div.innerHTML = `
            <span style="color:#6b7280;">${tick.time}</span>
            <span style="color:${color}; font-weight:500;">${tick.price}</span>
            <span style="color:#6b7280;">${tick.volume}</span>
        `
        container.appendChild(div)
    })
}

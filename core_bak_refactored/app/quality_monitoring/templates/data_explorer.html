<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>数据浏览器 | DeepSeekQuant</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif; margin: 0; background: #f7f8fa; }
        header { background: #1f2937; color: #fff; padding: 14px 20px; }
        .container { padding: 16px; }
        .form { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; margin-bottom: 16px; }
        .form input, .form select, .form button { padding: 8px; border: 1px solid #d1d5db; border-radius: 6px; }
        .grid { display: grid; grid-template-columns: 2fr 1fr; gap: 16px; }
        .card { background: #fff; border: 1px solid #e5e7eb; border-radius: 8px; box-shadow: 0 1px 2px rgba(0,0,0,0.04); }
        .card-header { padding: 10px 12px; border-bottom: 1px solid #e5e7eb; font-weight: 600; color: #374151; }
        .card-body { padding: 8px; }
        #priceChart, #returnChart { height: 360px; }
        #eventWindowChart { height: 300px; }
        .table { width: 100%; border-collapse: collapse; font-size: 13px; }
        .table th, .table td { border: 1px solid #e5e7eb; padding: 6px 8px; }
        .table th { background: #f3f4f6; text-align: left; }
    </style>
</head>
<body>
<header>
    <h2>数据浏览器</h2>
</header>
<div class="container">
    <div class="form">
        <input id="indexId" placeholder="指数ID (如: CSI300)">
        <input id="startDate" placeholder="开始日期 YYYY-MM-DD">
        <input id="endDate" placeholder="结束日期 YYYY-MM-DD">
        <select id="eventType">
            <option value="market_crash">market_crash</option>
            <option value="policy_change">policy_change</option>
        </select>
        <button onclick="loadData()">加载数据</button>
    </div>

    <div class="grid">
        <div class="card">
            <div class="card-header">指数价格</div>
            <div class="card-body"><div id="priceChart"></div></div>
        </div>
        <div class="card">
            <div class="card-header">收益率序列</div>
            <div class="card-body"><div id="returnChart"></div></div>
        </div>
    </div>

    <div class="card" style="margin-top:16px;">
        <div class="card-header">事件窗口样本</div>
        <div class="card-body">
            <div id="eventWindowChart"></div>
            <table class="table" id="eventSamples">
                <thead><tr><th>日期</th><th>价格</th><th>来源</th></tr></thead>
                <tbody></tbody>
            </table>
        </div>
    </div>
</div>

<script>
    const priceChart = echarts.init(document.getElementById('priceChart'))
    const returnChart = echarts.init(document.getElementById('returnChart'))
    const eventWindowChart = echarts.init(document.getElementById('eventWindowChart'))

    function showEmpty(chart, text) {
        chart.setOption({
            xAxis: { show: false }, yAxis: { show: false }, series: [],
            graphic: [{ type: 'text', left: 'center', top: 'center', style: { text: text || '暂无数据', fontSize: 16, fill: '#999' } }]
        }, true)
    }

    function loadData() {
        const indexId = document.getElementById('indexId').value
        const startDate = document.getElementById('startDate').value
        const endDate = document.getElementById('endDate').value
        if (!indexId || !startDate || !endDate) {
            showEmpty(priceChart, '请输入必要参数')
            showEmpty(returnChart, '请输入必要参数')
            showEmpty(eventWindowChart, '请输入必要参数')
            return
        }
        fetch(`/api/v1/data/index-prices?index_id=${encodeURIComponent(indexId)}&start_date=${startDate}&end_date=${endDate}`)
            .then(r => r.json()).then(res => {
                const data = res.data || []
                if (!data.length) return showEmpty(priceChart)
                const dates = data.map(d => d.date || d.Date || d.timestamp)
                const prices = data.map(d => d.price || d.close || d.value)
                priceChart.setOption({
                    tooltip: { trigger: 'axis' },
                    xAxis: { type: 'category', data: dates },
                    yAxis: { type: 'value' },
                    series: [{ type: 'line', data: prices, smooth: true, itemStyle: { color: '#2563eb' } }]
                }, true)
            }).catch(() => showEmpty(priceChart, '加载失败'))

        fetch(`/api/v1/data/index-returns?index_id=${encodeURIComponent(indexId)}&start_date=${startDate}&end_date=${endDate}`)
            .then(r => r.json()).then(res => {
                const data = res.data || []
                if (!data.length) return showEmpty(returnChart)
                const dates = data.map(d => d.date)
                const returns = data.map(d => d.return)
                returnChart.setOption({
                    tooltip: { trigger: 'axis' },
                    xAxis: { type: 'category', data: dates },
                    yAxis: { type: 'value' },
                    series: [{ type: 'bar', data: returns, itemStyle: { color: '#10b981' } }]
                }, true)
            }).catch(() => showEmpty(returnChart, '加载失败'))

        fetch(`/api/v1/data/event-window?index_id=${encodeURIComponent(indexId)}&event_date=${endDate}&event_type=${document.getElementById('eventType').value}&window_days=10&baseline_days=20`)
            .then(r => r.json()).then(res => {
                const samples = (res.event_window && res.event_window.samples) || []
                if (!samples.length) return showEmpty(eventWindowChart)
                const dates = samples.map(s => s.date || s.Date)
                const prices = samples.map(s => s.price || s.close || s.value)
                eventWindowChart.setOption({
                    tooltip: { trigger: 'axis' },
                    xAxis: { type: 'category', data: dates },
                    yAxis: { type: 'value' },
                    series: [{ type: 'line', data: prices, itemStyle: { color: '#f59e0b' } }]
                }, true)
                const tbody = document.querySelector('#eventSamples tbody')
                tbody.innerHTML = samples.map(s => `<tr><td>${s.date || ''}</td><td>${s.price ?? s.close ?? ''}</td><td>${s.source || ''}</td></tr>`).join('')
            }).catch(() => showEmpty(eventWindowChart, '加载失败'))
    }

    // 初始空态
    showEmpty(priceChart)
    showEmpty(returnChart)
    showEmpty(eventWindowChart)
</script>
</body>
</html>

<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>数据浏览器 | DeepSeekQuant</title>
    <link rel="stylesheet" href="/static/css/common.css">
    <script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
    <style>
        /* Explorer 专用样式 */
        .two-columns {
            display: flex !important;
            gap: 16px;
            align-items: flex-start;
            flex-wrap: nowrap;
            min-height: 600px;
        }
        .left-panel {
            flex-shrink: 0;
            background: #fff;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            padding: 12px;
        }
        .right-panel {
            flex: 1;
            background: #fff;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            padding: 12px;
        }
        .panel-header {
            font-size: 14px;
            font-weight: 600;
            color: #374151;
            margin-bottom: 8px;
        }
        .segmented-control {
            display: flex;
            gap: 8px;
            align-items: center;
            flex-wrap: wrap;
        }
        
        /* ECharts 容器样式 */
        #klineChart,
        #indicatorChart {
            cursor: default;
        }
        
        .btn-segment {
            padding: 6px 14px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            background: #fff;
            color: #4b5563;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-segment:hover {
            background: #f3f4f6;
            border-color: #9ca3af;
        }
        .btn-segment.active {
            background: #2563eb;
            color: #fff;
            border-color: #2563eb;
        }
        .list {
            max-height: 500px;
            overflow-y: auto;
        }
        .list-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 12px;
            border-bottom: 1px solid #f3f4f6;
            cursor: pointer;
            transition: background 0.2s;
        }
        .list-item:hover {
            background: #f9fafb;
        }
        .list-item.active {
            background: #eff6ff;
            border-left: 3px solid #2563eb;
        }
        .list-item-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }
        .list-item-name {
            font-size: 14px;
            font-weight: 500;
            color: #1f2937;
        }
        .list-item-code {
            font-size: 12px;
            color: #6b7280;
        }
        .list-item-actions {
            display: flex;
            gap: 4px;
        }
        .btn-icon {
            padding: 4px 8px;
            border: none;
            background: transparent;
            color: #9ca3af;
            font-size: 12px;
            cursor: pointer;
            transition: color 0.2s;
        }
        .btn-icon:hover {
            color: #ef4444;
        }
        .indicator-area {
            margin-top: 12px;
        }
        #klineChart, #indicatorChart {
            width: 100%;
        }
        /* 模态框样式 */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
        }
        .modal-content {
            background: #fff;
            border-radius: 8px;
            padding: 20px;
            width: 90%;
            max-width: 400px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }
        .modal-header {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 16px;
            color: #1f2937;
        }
        .modal-footer {
            display: flex;
            gap: 8px;
            justify-content: flex-end;
            margin-top: 16px;
        }
    </style>
</head>
<body>
<!-- 顶部导航栏 -->

<div class="container">
    <!-- 市场标题和交易时间信息 -->
    <div id="marketHeader" class="market-header" style="margin-bottom:16px; padding:16px; background:#f8f9fa; border-radius:8px; border:1px solid #e9ecef;">
        <div style="display:flex; justify-content:space-between; align-items:center;">

                <div id="modeSelector" class="segmented-control" style="width:200px;">
                    <button class="btn btn-segment active" onclick="switchMode('real', this)">真实数据</button>
                    <button class="btn btn-segment" onclick="switchMode('mock', this)">模拟数据</button>

                <!-- 布局将由 IntradayChart.rebuildLayout() 动态生成 -->
            </div>
            <!-- 顶部：图表类型切换（默认隐藏,kline_chart.js 动态重建布局-->
            <div id="klineContainer"  style="display:none; gap:12px; margin-bottom:8px; align-items:center;">

    <script src="/static/js/common.js" defer></script>
    <!-- 🔧 分时图独立模块 -->
    <script src="/static/js/intraday_chart.js" defer></script>
    <!-- 🔧 K线图独立模块 -->
    <script src="/static/js/kline_chart.js" defer></script>
    <script>
/**
 * 🔧 构建全局数据模式选择器（模拟/真实）- 可用于K线图和分时图
 */

// 🔧 删除：currentMarketKey - 前端不再判断市场，完全依赖后端 should_poll
let currentSymbol = null
let currentChartType = 'intraday'  // 🔧 修改：默认为分时图
let globalDataMode = 'real'  // 'mock' 或 'real'，全局数据模式
let mockTradingPhase = 'TRADING'  // 模拟控制：BEFORE_OPEN, TRADING, AFTER_CLOSE外部传入，
let currentMarketCode = null  // 当前市场代码，data_explorer.html 范围的属性
// 注意：intradayData、intradayUpdateTimer 已在 intraday_chart.js 中声明

function init() {
    // 同时获取市场配置和默认指数列表
    Promise.all([
        fetch('/api/v1/markets/config').then(r => r.json()),
        fetch('/api/v1/markets/default-indices').then(r => r.json())
    ])
    .then(([configData, indicesData]) => {
    if (configData.status !== 'success' || indicesData.status !== 'success') {
        console.error('加载失败: ' + (configData.message || indicesData.message || '未知错误'));
        return;
    }
    
    const markets = configData.data.markets || [];
    const marketSources = configData.data.market_sources || {};
    const defaultIndices = indicesData.data || {};

    // 保存markets配置为全局变量，作为时区映射的数据源
    window.marketsConfig = markets;
    console.log('✅ 加载市场配置:', markets.map(m => ({code: m.code, name: m.name})));
    console.log('✅ 加载默认指数列表:', defaultIndices);

    // 构建 window.marketConfig 用于分时图功能
    window.marketConfig = {};
    if (configData.data && Array.isArray(configData.data.markets)) {
        configData.data.markets.forEach(market => {
            const detailedHours = market.detailed_trading_hours || AppUtils.parseTradingHoursString(market.trading_hours)
            window.marketConfig[market.code.toUpperCase()] = {
                detailed_trading_hours: detailedHours,
                trading_hours: market.trading_hours,
                timezone: market.timezone,
                currency: market.currency
            };
            console.log(`🔍 市场配置 - ${market.code}:`, detailedHours);
        });
        
        // 同时更新 window.marketsConfig 以保持兼容性（如果不存在）
        if (!window.marketsConfig) {
            window.marketsConfig = configData.data.markets;
        }
    }
    console.log('✅ 市场配置加载成功:', Object.keys(window.marketConfig))
    console.log('✅ 分时图市场配置加载完成');
    console.log('🔍 window.marketConfig 完整内容:', window.marketConfig);
    
    // 为界面验证：构建完整的市场配置，包括默认指数
    const completeMarkets = [];

    // 为每个市场构建完整配置
    markets.forEach(market => {
        const marketIndices = defaultIndices[market.code] || [];
        completeMarkets.push({
            id: market.code,
            name: market.name,
            default_indices: marketIndices
        });
    });
    buildMarketSelector(completeMarkets)
    if (completeMarkets.length) {
        selectMarket(completeMarkets[0]); // 默认选择第一个市场（A股）
        console.log('✅ 默认选择第一个市场：', completeMarkets[0].name);
    }
}).catch(err => {
    console.error('初始化失败: ' + err.message);
});
}
function buildMarketSelector(markets) {
    const container = document.getElementById('marketSelector')
    container.innerHTML = ''
    markets.forEach((m, idx) => {
        const btn = document.createElement('button')
        btn.className = 'btn btn-segment'
        if (idx === 0) btn.classList.add('active')
        btn.textContent = m.name
        btn.onclick = () => {
            container.querySelectorAll('.btn-segment').forEach(b => b.classList.remove('active'))
            btn.classList.add('active')
            selectMarket(m)
        }
        container.appendChild(btn)
    })
}
/**
 * 更新市场标题和交易时间信息
 * @param {string} marketCode - 市场代码（CN、US、HK等）
 */
function updateMarketHeader(marketCode) {
    if (!window.marketsConfig || !Array.isArray(window.marketsConfig)) {
        console.warn('markets配置未加载，无法更新市场标题')
        return
    }
    
    // 从markets配置中查找对应市场信息
    const market = window.marketsConfig.find(m => m.code === marketCode)
    if (!market) {
        console.warn(`未找到市场代码 ${marketCode} 的配置`)
        return
    }
    
    // 更新市场标题
    const marketTitle = document.getElementById('marketTitle')
    if (marketTitle) {
        marketTitle.textContent = market.name
    }
    
    // 更新市场图标
    const marketIcon = document.getElementById('marketIcon')
    if (marketIcon) {
        // 使用市场配置中的图标，如果没有则使用默认图标
        marketIcon.textContent = market.icon || '🌐'
    }
    
    // 更新交易时间信息
    const tradingHoursSpan = document.getElementById('tradingHours')
    const preMarketHoursSpan = document.getElementById('preMarketHours')
    
    if (tradingHoursSpan) {
        if (market.trading_hours) {
            tradingHoursSpan.textContent = `交易时间：${market.trading_hours}`
        } else {
            tradingHoursSpan.textContent = '交易时间：未配置'
        }
    }
    
    if (preMarketHoursSpan) {
        if (market.pre_market) {
            preMarketHoursSpan.textContent = `盘前交易：${market.pre_market}`
        } else {
            preMarketHoursSpan.textContent = '盘前交易：无'
        }
    }
    
    console.log('✅ 更新市场标题信息:', {
        name: market.name,
        trading_hours: market.trading_hours,
        pre_market: market.pre_market
    })
}

function selectMarket(market) {
    // 设置当前市场代码（从market.id中提取CN、US等代码，与market.yml中的market_registry id一致）
    // market.id格式为 'CN'
    const marketCode = market.id
    currentMarketCode = marketCode
    console.log('✅ 设置当前市场代码:', currentMarketCode, '来源:', market.id)

    // 更新市场标题和交易时间信息
    updateMarketHeader(marketCode)

    const indices = (market.default_indices || [])
    buildIndexList(indices)
    // 市场切换后自动选择第一个指数，具体的图表清理和加载在selectIndex中处理
    if (indices.length)
       selectIndex(indices[0])
}

function buildIndexList(indices) {
    const list = document.getElementById('indexList')
    list.innerHTML = ''
    indices.forEach((item, idx) => {
        const row = document.createElement('div')
        row.className = 'list-item'
        if (idx === 0) row.classList.add('active')
        const content = document.createElement('div')
        content.className = 'list-item-content'
        const name = document.createElement('div')
        name.className = 'list-item-name'
        name.textContent = item.name
        const code = document.createElement('div')
        code.className = 'list-item-code'
        code.textContent = item.id
        content.appendChild(name)
        content.appendChild(code)
        row.appendChild(content)
        const actions = document.createElement('div')
        actions.className = 'list-item-actions'
        const delBtn = document.createElement('button')
        delBtn.className = 'btn-icon'
        delBtn.innerHTML = '✕'
        delBtn.title = '删除'
        delBtn.onclick = (e) => {
            e.stopPropagation()
            row.remove()
            if (currentSymbol && currentSymbol.id === item.id) {
                const remaining = list.querySelectorAll('.list-item')
                if (remaining.length) remaining[0].click()
                else {
                    window.KlineChart.showEmpty()
                }
            }
        }
        actions.appendChild(delBtn)
        row.appendChild(actions)
        row.onclick = () => {
            list.querySelectorAll('.list-item').forEach(r => r.classList.remove('active'))
            row.classList.add('active')
            selectIndex(item)
        }
        list.appendChild(row)
    })
}

function selectIndex(item) {
    currentSymbol = item
    reload()
}



// ==================== 辅助函数 ====================

function switchPhase(phase, element) {
    const container = document.getElementById('modePhaseSelector');
    if(container) {
        const buttons = container.querySelectorAll('.segmented-control .btn-segment');
        buttons.forEach(b => b.classList.remove('active'));
        element.classList.add('active');
    }
    mockTradingPhase=phase
    reload()
}

/**
 * 切换图表类型（K线图/分时图）
 */
function switchChartType(type, element) {
    // 更新按钮状态
    const container = document.getElementById('chartTypeSelector');
    if(container) {
        const buttons = container.querySelectorAll('.btn-segment');
        buttons.forEach(b => b.classList.remove('active'));
        element.classList.add('active');
    }
    currentChartType = type
    reload()
}
/**
 * 🔧 切换数据模式（模拟/真实）- 全局模式控制
 */
function switchMode(mode, element) {
    // 更新按钮状态
    const container = document.getElementById('modeSelector');
    if(container) {
        const buttons = container.querySelectorAll('.btn-segment');
        buttons.forEach(b => b.classList.remove('active'));
        element.classList.add('active');
    }
    // 更新全局模式状态
    globalDataMode = mode
    const phaseContainer = document.getElementById('modePhaseSelector')
    if(phaseContainer) {
        phaseContainer.style.display = globalDataMode==='mock'?'block':'none'
    }
    reload()
}

function reload(){
    if (currentSymbol && currentChartType === 'intraday') {
        if (window.IntradayChart) {
            window.IntradayChart.setCurrent(currentSymbol,currentSymbol.type !== 'index',currentMarketCode, globalDataMode==='mock',mockTradingPhase)
        } else {
            console.warn('⚠️ IntradayChart 未加载，跳过分时图重建和数据加载')
        }
    } else if (currentSymbol && currentChartType === 'kline') {
        if (window.KlineChart) {
            // 如果当前是K线图，也需要重新加载数据以应用新模式
            window.KlineChart.setCurrent(currentSymbol,currentMarketCode,globalDataMode==='mock',mockTradingPhase)
        }else {
            console.warn('⚠️ KlineChart 未加载，跳过k线图重建和数据加载')
        }
    }
}




// ==================== Mock模拟控制面板 ====================
// 初始化
init()

// 绑定添加按钮
document.getElementById('indexAddButton').onclick = () => {
    const overlay = document.createElement('div')
    overlay.className = 'modal-overlay'
    const modal = document.createElement('div')
    modal.className = 'modal-content'
    modal.innerHTML = `
        <div class="modal-header">添加指数/股票</div>
        <div class="form-group">
            <label class="form-label">代码</label>
            <input type="text" id="modalIndexId" class="form-control" placeholder="例: 000300.SH">
            <small style="color:#6b7280;margin-top:4px;display:block;">名称将自动识别，也可手动输入</small>
        </div>
        <div class="form-group">
            <label class="form-label">名称（可选）</label>
            <input type="text" id="modalIndexName" class="form-control" placeholder="留空将自动识别">
        </div>
        <div class="modal-footer">
            <button class="btn btn-sm" id="modalCancel">取消</button>
            <button class="btn btn-primary btn-sm" id="modalConfirm">确定</button>
        </div>
    `
    overlay.appendChild(modal)
    document.body.appendChild(overlay)
    overlay.onclick = (e) => { if (e.target === overlay) overlay.remove() }
    document.getElementById('modalCancel').onclick = () => overlay.remove()
    document.getElementById('modalConfirm').onclick = () => {
        const id = document.getElementById('modalIndexId').value.trim()
        let name = document.getElementById('modalIndexName').value.trim()
        if (!id) { alert('请输入代码'); return }
        // 自动识别名称（简单映射）
        if (!name) {
            const nameMap = {
                '000300.SH': '沪深300', '000001.SH': '上证指数', '399001.SZ': '深证成指', '399006.SZ': '创业板指',
                '601318.SH': '中国平安', '600519.SH': '贵州茅台', '000001.SZ': '平安银行', '000651.SZ': '格力电器',
                '300750.SZ': '宁德时代', 'HSI': '恒生指数', 'HSCEI': '国企指数', 'HSTECH': '恒生科技',
                '0700.HK': '腾讯控股', '0939.HK': '建设银行', '2318.HK': '中国平安',
                '^GSPC': 'S&P 500', '^DJI': '道琼斯', '^IXIC': '纳斯达克',
                'AAPL': 'Apple', 'MSFT': 'Microsoft', 'AMZN': 'Amazon', 'GOOGL': 'Alphabet', 'TSLA': 'Tesla'
            }
            name = nameMap[id] || id
        }
        const newItem = { id, name, type: 'custom' }
        const list = document.getElementById('indexList')
        const existing = Array.from(list.querySelectorAll('.list-item')).find(r => r.querySelector('.list-item-code').textContent === id)
        if (existing) { alert('该代码已存在'); return }
        // 复用 buildIndexList 的逻辑构造单个 item
        const row = document.createElement('div')
        row.className = 'list-item'
        const content = document.createElement('div')
        content.className = 'list-item-content'
        const nameEl = document.createElement('div')
        nameEl.className = 'list-item-name'
        nameEl.textContent = name
        const codeEl = document.createElement('div')
        codeEl.className = 'list-item-code'
        codeEl.textContent = id
        content.appendChild(nameEl)
        content.appendChild(codeEl)
        row.appendChild(content)
        const actions = document.createElement('div')
        actions.className = 'list-item-actions'
        const delBtn = document.createElement('button')
        delBtn.className = 'btn-icon'
        delBtn.innerHTML = '✕'
        delBtn.title = '删除'
        delBtn.onclick = (e) => {
            e.stopPropagation()
            row.remove()
            if (currentSymbol && currentSymbol.id === id) {
                const remaining = list.querySelectorAll('.list-item')
                if (remaining.length) remaining[0].click()
                else {
                    window.KlineChart.showEmpty()
                }
            }
        }
        actions.appendChild(delBtn)
        row.appendChild(actions)
        row.onclick = () => {
            list.querySelectorAll('.list-item').forEach(r => r.classList.remove('active'))
            row.classList.add('active')
            selectIndex(newItem)
        }
        list.appendChild(row)
        overlay.remove()
        row.click()
    }
}



/**
 * 从后端获取市场配置信息
 */
/**
 * 根据市场配置生成完整交易时段的时间轴
 * @param {string} marketCode - 市场代码
 * @returns {Array} 完整的交易时间数组
 */
/**
 * 更新买卖盘口
 */
function updateOrderBook(orderBook) {
    if (!orderBook) return
    
    const tbody = document.getElementById('orderBookBody')
    if (!tbody) {
        console.warn('⚠️ orderBookBody 元素不存在，跳过盘口更新（可能是指数布局）')
        return
    }
    tbody.innerHTML = ''
    
    // 🔧 使用后端返回的提示信息（而非前端判断）
    if (!orderBook.bids || orderBook.bids.length === 0) {
        // 获取后端返回的提示信息
        const message = orderBook.message || '无盘口数据'
        tbody.innerHTML = `
            <tr>
                <td colspan="3" style="text-align:center; padding:20px; color:#9ca3af;">
                    <div style="font-size:13px;">${message}</div>
                </td>
            </tr>
        `
        return
    }
    
    // 倒序显示卖单（从卖五到卖一）
    const sellCount = Math.min(5, orderBook.asks.length)
    for (let i = orderBook.asks.length - 1, idx = 0; i >= 0 && idx < sellCount; i--, idx++) {
        const ask = orderBook.asks[i]
        const sellNum = sellCount - idx  // 卖五、卖四、...、卖一
        const tr = document.createElement('tr')
        tr.innerHTML = `
            <td style="padding:4px; text-align:left; color:#10b981; font-size:10px;">卖${sellNum}</td>
            <td style="padding:4px; text-align:center; color:#10b981; font-weight:500;">${ask.price.toFixed(2)}</td>
            <td style="padding:4px; text-align:right; color:#10b981;">${ask.volume}</td>
        `
        tbody.appendChild(tr)
    }
    
    // 分割线
    const divider = document.createElement('tr')
    divider.innerHTML = '<td colspan="3" style="padding:8px 4px; text-align:center; background:#f3f4f6; font-size:10px; color:#9ca3af;">--------</td>'
    tbody.appendChild(divider)
    
    // 正序显示买单（从买一到买五）
    const buyCount = Math.min(5, orderBook.bids.length)
    for (let i = 0; i < buyCount; i++) {
        const bid = orderBook.bids[i]
        const buyNum = i + 1  // 买一、买二、...、买五
        const tr = document.createElement('tr')
        tr.innerHTML = `
            <td style="padding:4px; text-align:left; color:#ef4444; font-size:10px;">买${buyNum}</td>
            <td style="padding:4px; text-align:center; color:#ef4444; font-weight:500;">${bid.price.toFixed(2)}</td>
            <td style="padding:4px; text-align:right; color:#ef4444;">${bid.volume}</td>
        `
        tbody.appendChild(tr)
    }
}

/**
 * 更新成交明细
 */
// ========== 市场时区相关工具函数 ==========



function updateTicker(tickersData) {
    if (!tickersData) return
    
    const container = document.getElementById('tickerList')
    if (!container) {
        console.warn('⚠️ tickerList 元素不存在，跳过成交明细更新（可能是指数布局）')
        return
    }
    
    // 🔧 从新的数据结构中获取tickers和message
    const trade_records = tickersData.items || []
    const message = tickersData.message || '无成交明细'
    
    if (trade_records.length === 0) {
        container.innerHTML = `
            <div style="text-align:center; padding:20px; color:#9ca3af;">
                <div style="font-size:13px;">${message}</div>
            </div>
        `
        return
    }
    
    container.innerHTML = ''
    
    // ... existing code ...
    trade_records.forEach(tick => {
        const div = document.createElement('div')
        div.style.cssText = 'display:flex; justify-content:space-between; padding:3px 0; border-bottom:1px solid #f3f4f6;'
        const color = tick.type === 'buy' ? '#ef4444' : '#10b981'
        div.innerHTML = `
            <span style="color:#6b7280;">${tick.time}</span>
            <span style="color:${color}; font-weight:500;">${tick.price}</span>
            <span style="color:#6b7280;">${tick.volume}</span>
        `
        container.appendChild(div)
    })
}

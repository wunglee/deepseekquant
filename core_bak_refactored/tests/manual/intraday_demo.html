<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>分时数据展示 - DeepSeekQuant</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: #f5f5f5;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        
        h1 {
            color: #333;
            margin-bottom: 20px;
        }
        
        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        
        input, button {
            padding: 10px 15px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
        }
        
        button {
            background: #1890ff;
            color: white;
            cursor: pointer;
            border: none;
        }
        
        button:hover {
            background: #40a9ff;
        }
        
        .info-card {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }
        
        .info-item {
            padding: 15px;
            background: #fafafa;
            border-radius: 4px;
        }
        
        .info-label {
            font-size: 12px;
            color: #888;
            margin-bottom: 5px;
        }
        
        .info-value {
            font-size: 20px;
            font-weight: bold;
            color: #333;
        }
        
        .positive {
            color: #cf1322;
        }
        
        .negative {
            color: #52c41a;
        }
        
        #chart {
            width: 100%;
            height: 400px;
            border: 1px solid #ddd;
            border-radius: 4px;
            margin-bottom: 20px;
        }
        
        .order-book {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }
        
        .order-side {
            border: 1px solid #ddd;
            border-radius: 4px;
            padding: 15px;
        }
        
        .order-side h3 {
            margin-bottom: 10px;
            font-size: 16px;
        }
        
        .order-level {
            display: flex;
            justify-content: space-between;
            padding: 5px 0;
            border-bottom: 1px solid #f0f0f0;
        }
        
        .bid-price {
            color: #cf1322;
        }
        
        .ask-price {
            color: #52c41a;
        }
        
        .tickers {
            border: 1px solid #ddd;
            border-radius: 4px;
            padding: 15px;
            max-height: 300px;
            overflow-y: auto;
        }
        
        .tickers h3 {
            margin-bottom: 10px;
            font-size: 16px;
        }
        
        .ticker-item {
            display: flex;
            justify-content: space-between;
            padding: 5px 0;
            border-bottom: 1px solid #f0f0f0;
            font-size: 13px;
        }
        
        .buy-order {
            color: #cf1322;
        }
        
        .sell-order {
            color: #52c41a;
        }
        
        .loading {
            text-align: center;
            padding: 40px;
            color: #888;
        }
        
        .error {
            background: #fff2f0;
            border: 1px solid #ffccc7;
            padding: 15px;
            border-radius: 4px;
            color: #cf1322;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📈 实时分时数据展示</h1>
        
        <div class="controls">
            <input type="text" id="symbol" placeholder="输入股票代码（如：000300.SH）" value="000300.SH">
            <input type="date" id="tradeDate" value="">
            <button onclick="loadData()">加载数据</button>
            <button onclick="autoRefresh()">自动刷新</button>
        </div>
        
        <div id="content">
            <div class="loading">请点击"加载数据"按钮</div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <script>
        let chart = null;
        let refreshInterval = null;
        
        // 设置默认日期为今天
        document.getElementById('tradeDate').valueAsDate = new Date();
        
        async function loadData() {
            const symbol = document.getElementById('symbol').value;
            const tradeDate = document.getElementById('tradeDate').value;
            
            if (!symbol) {
                alert('请输入股票代码');
                return;
            }
            
            const content = document.getElementById('content');
            content.innerHTML = '<div class="loading">正在加载数据...</div>';
            
            try {
                const response = await fetch(`http://localhost:5000/api/v1/intraday/data?symbol=${symbol}&trade_date=${tradeDate}`);
                const result = await response.json();
                
                if (result.status === 'success') {
                    renderData(result.data);
                } else {
                    content.innerHTML = `<div class="error">加载失败: ${result.message}</div>`;
                }
            } catch (error) {
                content.innerHTML = `<div class="error">网络错误: ${error.message}</div>`;
            }
        }
        
        function renderData(data) {
            const content = document.getElementById('content');
            
            const changeClass = data.change >= 0 ? 'positive' : 'negative';
            const changeSign = data.change >= 0 ? '+' : '';
            
            content.innerHTML = `
                <div class="info-card">
                    <div class="info-item">
                        <div class="info-label">代码</div>
                        <div class="info-value">${data.symbol}</div>
                    </div>
                    <div class="info-item">
                        <div class="info-label">名称</div>
                        <div class="info-value">${data.name}</div>
                    </div>
                    <div class="info-item">
                        <div class="info-label">当前价</div>
                        <div class="info-value ${changeClass}">${data.current_price.toFixed(2)}</div>
                    </div>
                    <div class="info-item">
                        <div class="info-label">涨跌额</div>
                        <div class="info-value ${changeClass}">${changeSign}${data.change.toFixed(2)}</div>
                    </div>
                    <div class="info-item">
                        <div class="info-label">涨跌幅</div>
                        <div class="info-value ${changeClass}">${changeSign}${data.change_percent.toFixed(2)}%</div>
                    </div>
                    <div class="info-item">
                        <div class="info-label">昨收价</div>
                        <div class="info-value">${data.yesterday_close.toFixed(2)}</div>
                    </div>
                </div>
                
                <div id="chart"></div>
                
                <div class="order-book">
                    <div class="order-side">
                        <h3>买盘（Bids）</h3>
                        ${data.order_book.bids.slice(0, 5).map((level, i) => `
                            <div class="order-level">
                                <span>买${i + 1}</span>
                                <span class="bid-price">${level.price.toFixed(2)}</span>
                                <span>${level.volume}</span>
                            </div>
                        `).join('')}
                    </div>
                    <div class="order-side">
                        <h3>卖盘（Asks）</h3>
                        ${data.order_book.asks.slice(0, 5).map((level, i) => `
                            <div class="order-level">
                                <span>卖${i + 1}</span>
                                <span class="ask-price">${level.price.toFixed(2)}</span>
                                <span>${level.volume}</span>
                            </div>
                        `).join('')}
                    </div>
                </div>
                
                <div class="tickers">
                    <h3>成交明细（最近20笔）</h3>
                    ${data.tickers.map(ticker => `
                        <div class="ticker-item">
                            <span>${ticker.time}</span>
                            <span class="${ticker.type === 'buy' ? 'buy-order' : 'sell-order'}">${ticker.price.toFixed(2)}</span>
                            <span>${ticker.volume}</span>
                            <span>${ticker.type === 'buy' ? '买入' : '卖出'}</span>
                        </div>
                    `).join('')}
                </div>
            `;
            
            // 渲染图表
            renderChart(data);
        }
        
        function renderChart(data) {
            const chartDom = document.getElementById('chart');
            if (chart) {
                chart.dispose();
            }
            chart = echarts.init(chartDom);
            
            const option = {
                title: {
                    text: `${data.name} 分时走势`,
                    left: 'center'
                },
                tooltip: {
                    trigger: 'axis',
                    axisPointer: {
                        type: 'cross'
                    }
                },
                grid: {
                    left: '3%',
                    right: '4%',
                    bottom: '3%',
                    containLabel: true
                },
                xAxis: {
                    type: 'category',
                    data: data.times,
                    boundaryGap: false
                },
                yAxis: [
                    {
                        type: 'value',
                        name: '价格',
                        position: 'left'
                    },
                    {
                        type: 'value',
                        name: '成交量',
                        position: 'right'
                    }
                ],
                series: [
                    {
                        name: '价格',
                        type: 'line',
                        data: data.prices,
                        smooth: true,
                        lineStyle: {
                            color: data.change >= 0 ? '#cf1322' : '#52c41a'
                        },
                        itemStyle: {
                            color: data.change >= 0 ? '#cf1322' : '#52c41a'
                        },
                        areaStyle: {
                            color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [
                                {
                                    offset: 0,
                                    color: data.change >= 0 ? 'rgba(207, 19, 34, 0.3)' : 'rgba(82, 196, 26, 0.3)'
                                },
                                {
                                    offset: 1,
                                    color: data.change >= 0 ? 'rgba(207, 19, 34, 0.05)' : 'rgba(82, 196, 26, 0.05)'
                                }
                            ])
                        }
                    },
                    {
                        name: '均价',
                        type: 'line',
                        data: data.avg_prices,
                        smooth: true,
                        lineStyle: {
                            color: '#faad14',
                            type: 'dashed'
                        },
                        itemStyle: {
                            color: '#faad14'
                        }
                    },
                    {
                        name: '成交量',
                        type: 'bar',
                        yAxisIndex: 1,
                        data: data.volumes,
                        itemStyle: {
                            color: '#1890ff',
                            opacity: 0.3
                        }
                    }
                ]
            };
            
            chart.setOption(option);
        }
        
        function autoRefresh() {
            if (refreshInterval) {
                clearInterval(refreshInterval);
                refreshInterval = null;
                alert('已停止自动刷新');
            } else {
                loadData();
                refreshInterval = setInterval(loadData, 5000); // 每5秒刷新
                alert('已开启自动刷新（每5秒）');
            }
        }
        
        // 窗口大小改变时重绘图表
        window.addEventListener('resize', () => {
            if (chart) {
                chart.resize();
            }
        });
    </script>
</body>
</html>

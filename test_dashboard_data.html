<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard数据测试</title>
    <style>
        body { font-family: Arial; padding: 20px; background: #f5f5f5; }
        pre { background: #263238; color: #00FF00; padding: 15px; border-radius: 5px; overflow: auto; }
        .score { font-size: 48px; text-align: center; color: #2196F3; margin: 20px 0; }
        button { background: #2196F3; color: white; border: none; padding: 12px 24px; border-radius: 4px; cursor: pointer; margin: 5px; }
    </style>
</head>
<body>
    <h1>Dashboard数据测试</h1>
    
    <div>
        <button onclick="loadQualityData()">加载质量数据</button>
        <button onclick="triggerCheck()">触发检查</button>
        <button onclick="testAll()">测试所有API</button>
    </div>
    
    <h2>当前质量得分</h2>
    <div class="score" id="score">--</div>
    
    <h2>API响应数据</h2>
    <pre id="output">点击按钮加载数据...</pre>
    
    <script>
        const output = document.getElementById('output');
        const scoreDiv = document.getElementById('score');
        
        function log(message) {
            output.textContent += '\n' + message;
        }
        
        async function loadQualityData() {
            try {
                log('正在加载质量数据...');
                const response = await fetch('http://localhost:5001/api/dashboard/quality-data');
                const data = await response.json();
                
                log('\n========== 质量数据 ==========');
                log(JSON.stringify(data, null, 2));
                
                if (data.current_quality) {
                    const score = (data.current_quality.overall_score * 100).toFixed(2);
                    scoreDiv.textContent = score + '%';
                    scoreDiv.style.color = data.current_quality.overall_score > 0.9 ? '#4CAF50' : '#FFB300';
                    log(`\n✅ 质量得分: ${score}%`);
                    log(`✅ 数据点: ${data.history.length}条历史记录`);
                } else {
                    log('\n❌ 没有current_quality数据');
                }
            } catch (error) {
                log(`\n❌ 错误: ${error.message}`);
            }
        }
        
        async function triggerCheck() {
            try {
                log('\n正在触发质量检查...');
                const response = await fetch('http://localhost:5001/api/v1/trigger-check', {
                    method: 'POST'
                });
                const result = await response.json();
                log(`✅ ${result.message}`);
                
                // 等待2秒后重新加载数据
                setTimeout(loadQualityData, 2000);
            } catch (error) {
                log(`❌ 错误: ${error.message}`);
            }
        }
        
        async function testAll() {
            output.textContent = '开始测试所有API...\n';
            
            // 测试质量数据
            await loadQualityData();
            
            // 测试告警
            try {
                log('\n========== 告警数据 ==========');
                const alertsResp = await fetch('http://localhost:5001/api/dashboard/alerts?hours=24');
                const alertsData = await alertsResp.json();
                log(JSON.stringify(alertsData, null, 2));
            } catch (error) {
                log(`❌ 告警数据错误: ${error.message}`);
            }
            
            // 测试性能数据
            try {
                log('\n========== 性能数据 ==========');
                const perfResp = await fetch('http://localhost:5001/api/dashboard/performance');
                const perfData = await perfResp.json();
                log(JSON.stringify(perfData, null, 2));
            } catch (error) {
                log(`❌ 性能数据错误: ${error.message}`);
            }
        }
        
        // 页面加载完成后自动测试
        window.onload = () => {
            loadQualityData();
        };
    </script>
</body>
</html>
